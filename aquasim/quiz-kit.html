<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Quiz Kit">
<meta name="theme-color" content="#6b4bd6">
<meta name="description" content="Make your own personality quizzes step by step, learn how in the lessons, earn XP and spend it in the shop.">
<title>Quiz Kit — Make Your Own Personality Quizzes</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='52' font-size='52'%3E%F0%9F%94%AE%3C/text%3E%3C/svg%3E">
<style>
  *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  :root{
    --bg:#ece7fa; --frame:#ffffff; --ink:#241d3d; --muted:#6f668f; --line:#e4ddf3;
    --accent:#6b4bd6; --accent2:#9a7bf0; --soft:#f5f1fe;
    --good:#2e9e6b; --bad:#d3483f; --warn:#c47a15; --gold:#c99a2e;
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f0b1e; --frame:#1a1531; --ink:#f0ebff; --muted:#a79dcd; --line:#2d2650;
      --accent:#9d84f0; --accent2:#b9a2ff; --soft:#221b40;
      --good:#4fd39a; --bad:#ff6f6b; --warn:#f0b551; --gold:#f0c65a;
    }
  }
  html,body{ height:100%; }
  body{
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background:var(--bg); color:var(--ink);
    display:flex; justify-content:center; align-items:stretch;
    overflow:hidden; overscroll-behavior:none; -webkit-text-size-adjust:100%;
  }
  #app{
    width:100%; max-width:560px; height:100vh; height:100dvh;
    background:var(--frame); display:flex; flex-direction:column;
    position:relative; overflow:hidden; box-shadow:0 0 60px rgba(0,0,0,.16);
  }
  @media (min-width:600px) and (min-height:760px){
    body{ align-items:center; padding:16px 0; }
    #app{ height:min(900px, calc(100dvh - 32px)); border-radius:26px; border:1px solid var(--line); }
  }
  button, input, textarea, select { font:inherit; color:inherit; }
  button{ cursor:pointer; }

  /* ---------- Top bar ---------- */
  #top{
    flex:0 0 auto; padding:calc(10px + var(--safe-t)) 14px 11px;
    background:linear-gradient(145deg, var(--accent), var(--accent2)); color:#fff;
  }
  #topRow{ display:flex; align-items:center; gap:11px; }
  #logo{ font-size:26px; line-height:1; }
  #whoWrap{ flex:1 1 auto; min-width:0; }
  #who{ font-weight:800; font-size:1.02rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #rank{ font-size:.74rem; opacity:.9; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #xpPill{
    flex:0 0 auto; background:rgba(255,255,255,.22); border-radius:999px;
    padding:7px 13px; font-weight:800; font-size:.92rem; text-align:center;
  }
  #xpPill small{ display:block; font-weight:600; opacity:.85; font-size:.6rem; letter-spacing:.06em; }
  #lvlTrack{ height:6px; border-radius:99px; background:rgba(0,0,0,.2); overflow:hidden; margin-top:10px; }
  #lvlFill{ display:block; height:100%; width:0; background:#ffe08a; border-radius:99px; transition:width .5s cubic-bezier(.3,1.3,.5,1); }

  /* ---------- Screen ---------- */
  #screen{ flex:1 1 auto; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; padding:16px 14px 22px; }
  h2.sh{ font-size:1.24rem; font-weight:800; margin-bottom:3px; }
  p.sub{ color:var(--muted); font-size:.86rem; line-height:1.45; margin-bottom:14px; }

  /* ---------- Bottom tabs ---------- */
  #tabs{
    flex:0 0 auto; display:grid; grid-template-columns:repeat(4,1fr);
    border-top:1px solid var(--line); background:var(--frame);
    padding-bottom:var(--safe-b);
  }
  .tab{
    background:none; border:0; padding:9px 2px 8px; display:flex; flex-direction:column;
    align-items:center; gap:3px; color:var(--muted); font-size:.66rem; font-weight:700;
    letter-spacing:.02em; transition:color .15s;
  }
  .tab i{ font-style:normal; font-size:20px; line-height:1; filter:grayscale(.55); transition:filter .15s, transform .15s; }
  .tab.on{ color:var(--accent); }
  .tab.on i{ filter:none; transform:translateY(-1px) scale(1.12); }

  /* ---------- Cards & buttons ---------- */
  .card{
    background:var(--soft); border:1px solid var(--line); border-radius:16px;
    padding:14px; margin-bottom:12px;
  }
  .card.flat{ background:var(--frame); }
  .card h3{ font-size:1rem; font-weight:800; margin-bottom:4px; }
  .card p{ font-size:.85rem; color:var(--muted); line-height:1.5; }
  .row{ display:flex; align-items:center; gap:10px; }
  .grow{ flex:1 1 auto; min-width:0; }
  .btn{
    border:0; border-radius:13px; background:var(--accent); color:#fff;
    font-weight:800; font-size:.92rem; padding:12px 18px;
    box-shadow:0 3px 0 rgba(0,0,0,.18); transition:transform .07s, box-shadow .07s, opacity .15s;
  }
  .btn:active{ transform:translateY(3px); box-shadow:0 0 0 rgba(0,0,0,.18); }
  .btn.wide{ display:block; width:100%; }
  .btn.ghost{ background:var(--frame); color:var(--accent); border:2px solid var(--accent); box-shadow:none; }
  .btn.ghost:active{ transform:translateY(2px); }
  .btn.grey{ background:#8a83a4; }
  .btn.green{ background:var(--good); }
  .btn.small{ font-size:.78rem; padding:8px 13px; border-radius:10px; }
  .btn[disabled]{ opacity:.45; pointer-events:none; }
  .chip{
    display:inline-block; background:var(--soft); border:1px solid var(--line);
    border-radius:999px; padding:4px 11px; font-size:.72rem; font-weight:700; color:var(--muted);
  }
  .chip.good{ background:rgba(46,158,107,.14); color:var(--good); border-color:transparent; }
  .chip.gold{ background:rgba(201,154,46,.16); color:var(--gold); border-color:transparent; }
  .chip.bad{ background:rgba(211,72,63,.13); color:var(--bad); border-color:transparent; }
  label.fl{ display:block; font-size:.74rem; font-weight:800; letter-spacing:.04em;
    text-transform:uppercase; color:var(--muted); margin:0 0 5px 2px; }
  input.tf, textarea.tf, select.tf{
    width:100%; background:var(--frame); border:2px solid var(--line); border-radius:12px;
    padding:11px 12px; font-size:.95rem; outline:none; transition:border-color .15s;
  }
  input.tf:focus, textarea.tf:focus, select.tf:focus{ border-color:var(--accent); }
  textarea.tf{ resize:vertical; min-height:74px; line-height:1.45; }
  .hint{ font-size:.74rem; color:var(--muted); margin-top:5px; line-height:1.4; }
  .hide{ display:none !important; }
  .center{ text-align:center; }

  /* ---------- Toast ---------- */
  #toast{
    position:absolute; left:50%; bottom:78px; transform:translate(-50%,14px);
    background:var(--ink); color:var(--frame); padding:11px 17px; border-radius:14px;
    font-size:.86rem; font-weight:700; max-width:84%; text-align:center;
    opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:60;
    box-shadow:0 10px 26px rgba(0,0,0,.3);
  }
  #toast.show{ opacity:1; transform:translate(-50%,0); }

  /* ---------- Modal ---------- */
  #modalWrap{
    position:absolute; inset:0; background:rgba(20,14,40,.55); z-index:50;
    display:flex; align-items:flex-end; justify-content:center; padding:14px;
    opacity:0; pointer-events:none; transition:opacity .18s;
  }
  #modalWrap.show{ opacity:1; pointer-events:auto; }
  #modal{
    width:100%; max-width:480px; background:var(--frame); border-radius:20px; padding:18px;
    max-height:86%; overflow-y:auto; transform:translateY(20px); transition:transform .22s cubic-bezier(.3,1.2,.5,1);
  }
  #modalWrap.show #modal{ transform:none; }
  #modal h3{ font-size:1.1rem; font-weight:800; margin-bottom:6px; }
  #modal p{ font-size:.88rem; color:var(--muted); line-height:1.5; }

  /* ---------- Steps ---------- */
  #stepBar{ display:flex; gap:5px; margin-bottom:14px; }
  .stepDot{ flex:1 1 0; height:6px; border-radius:99px; background:var(--line); transition:background .25s; }
  .stepDot.done{ background:var(--accent2); }
  .stepDot.on{ background:var(--accent); }
  .stepNo{ font-size:.72rem; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); margin-bottom:3px; }
  .stepNav{ display:flex; gap:9px; margin-top:16px; }
  .stepNav .btn{ flex:1 1 0; }

  /* ---------- Editable lists ---------- */
  .item{
    background:var(--frame); border:1px solid var(--line); border-radius:14px;
    padding:11px 12px; margin-bottom:9px;
  }
  .item .tt{ font-weight:700; font-size:.92rem; }
  .item .st{ font-size:.76rem; color:var(--muted); margin-top:2px; line-height:1.4; }
  .iconBtn{
    border:0; background:var(--soft); border-radius:10px; width:34px; height:34px;
    font-size:15px; display:grid; place-items:center; flex:0 0 auto; color:var(--muted);
  }
  .iconBtn:active{ transform:scale(.92); }
  .emojiPick{ font-size:24px; width:46px; height:46px; border-radius:12px; border:2px solid var(--line);
    background:var(--frame); display:grid; place-items:center; flex:0 0 auto; }
  .emojiGrid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(44px,1fr)); gap:6px; margin-top:10px; }
  .emojiGrid button{ font-size:22px; padding:7px 0; border-radius:10px; border:2px solid transparent; background:var(--soft); }
  .emojiGrid button.on{ border-color:var(--accent); }

  /* ---------- Shop ---------- */
  .segs{ display:flex; background:var(--soft); border-radius:12px; padding:4px; gap:4px; margin-bottom:14px; }
  .segs button{ flex:1 1 0; border:0; background:none; padding:8px 4px; border-radius:9px;
    font-size:.82rem; font-weight:800; color:var(--muted); }
  .segs button.on{ background:var(--frame); color:var(--accent); box-shadow:0 2px 6px rgba(0,0,0,.09); }
  .shopItem{ display:flex; gap:12px; align-items:center; background:var(--frame);
    border:1px solid var(--line); border-radius:15px; padding:12px; margin-bottom:10px; }
  .shopIcon{ width:52px; height:52px; border-radius:13px; display:grid; place-items:center;
    font-size:25px; flex:0 0 auto; background:var(--soft); overflow:hidden; }
  .shopIcon svg{ width:100%; height:100%; display:block; }
  .price{ font-weight:800; font-size:.82rem; color:var(--gold); white-space:nowrap; }
  .swatch{ width:18px; height:18px; border-radius:6px; display:inline-block; vertical-align:-3px; margin-right:3px; }

  /* ---------- Play ---------- */
  #playWrap{ position:absolute; inset:0; z-index:30; display:flex; flex-direction:column; background:var(--frame); }
  #playWrap .playTop{ flex:0 0 auto; padding:calc(9px + var(--safe-t)) 13px 10px; display:flex; align-items:center; gap:10px; }
  #playWrap .playBody{ flex:1 1 auto; overflow-y:auto; padding:16px 15px calc(24px + var(--safe-b)); }
  .pgTrack{ flex:1 1 auto; height:7px; border-radius:99px; background:rgba(255,255,255,.32); overflow:hidden; }
  .pgFill{ display:block; height:100%; width:0; border-radius:99px; background:#fff; transition:width .3s; }
  .xBtn{ border:0; background:rgba(255,255,255,.25); color:#fff; width:32px; height:32px; border-radius:50%;
    font-size:15px; font-weight:800; flex:0 0 auto; display:grid; place-items:center; }
  .qNum{ font-size:.72rem; font-weight:800; letter-spacing:.08em; text-transform:uppercase; opacity:.75; margin-bottom:5px; }
  .qText{ font-size:1.18rem; font-weight:800; line-height:1.35; margin-bottom:15px; }
  .ansBtn{
    display:block; width:100%; text-align:left; border:2px solid rgba(0,0,0,.08);
    border-radius:15px; padding:14px 15px; margin-bottom:10px; font-size:.95rem; font-weight:600;
    background:rgba(255,255,255,.92); color:#1d1832; transition:transform .08s, border-color .1s;
  }
  .ansBtn:active{ transform:scale(.98); }
  .picGrid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .picGrid .ansBtn{ margin-bottom:0; text-align:center; padding:10px 10px 12px; }
  .picGrid svg{ width:100%; height:auto; display:block; border-radius:10px; margin-bottom:6px; }
  .picGrid .cap{ font-size:.82rem; font-weight:700; }
  .resultBig{ font-size:66px; line-height:1; text-align:center; margin-bottom:6px; }

  /* ---------- Misc ---------- */
  .empty{ text-align:center; color:var(--muted); padding:30px 18px; font-size:.88rem; line-height:1.55; }
  .empty .big{ font-size:44px; display:block; margin-bottom:10px; filter:grayscale(.3); }
  code.share{ display:block; word-break:break-all; background:var(--soft); border:1px solid var(--line);
    border-radius:11px; padding:10px; font-size:.66rem; font-family:ui-monospace, Menlo, Consolas, monospace;
    max-height:130px; overflow-y:auto; line-height:1.45; margin:8px 0; color:var(--muted); }
  .checkRow{ display:flex; gap:10px; align-items:flex-start; padding:9px 0; border-bottom:1px solid var(--line); }
  .checkRow:last-child{ border-bottom:0; }
  .checkMark{ font-size:16px; flex:0 0 auto; width:22px; text-align:center; }
  .checkTxt{ flex:1 1 auto; font-size:.85rem; line-height:1.42; }
  .checkTxt b{ font-weight:800; }
  .checkTxt span{ display:block; color:var(--muted); font-size:.78rem; margin-top:2px; }
  .scoreBig{ font-size:2.5rem; font-weight:900; text-align:center; line-height:1.05; }
  .lessonDot{ width:28px; height:28px; border-radius:50%; display:grid; place-items:center;
    font-size:.74rem; font-weight:800; flex:0 0 auto; background:var(--soft); color:var(--muted); border:2px solid var(--line); }
  .lessonDot.done{ background:var(--good); color:#fff; border-color:transparent; }
  .lessonDot.now{ border-color:var(--accent); color:var(--accent); }
  .lessonBody p{ font-size:.92rem; line-height:1.62; color:var(--ink); margin-bottom:11px; }
  .lessonBody .eg{ background:var(--soft); border-left:4px solid var(--accent2); border-radius:0 12px 12px 0;
    padding:11px 13px; margin-bottom:12px; font-size:.88rem; line-height:1.55; color:var(--muted); }
  .lessonBody .eg b{ color:var(--ink); }
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div id="topRow">
      <div id="logo">&#128302;</div>
      <div id="whoWrap">
        <div id="who">Quiz Kit</div>
        <div id="rank">Loading&hellip;</div>
      </div>
      <div id="xpPill"><span id="xpNum">0</span><small>XP TO SPEND</small></div>
    </div>
    <div id="lvlTrack"><span id="lvlFill"></span></div>
  </div>

  <div id="screen"></div>

  <div id="tabs">
    <button class="tab" data-tab="learn"><i>&#127891;</i>Learn</button>
    <button class="tab" data-tab="make"><i>&#9997;&#65039;</i>Make</button>
    <button class="tab" data-tab="mine"><i>&#128218;</i>My Quizzes</button>
    <button class="tab" data-tab="shop"><i>&#128717;&#65039;</i>Shop</button>
  </div>

  <div id="toast"></div>
  <div id="modalWrap"><div id="modal"></div></div>
  <div id="playWrap" class="hide"></div>
</div>
<script>
(function(){
'use strict';
/* ============================================================
   QUIZ KIT — make your own personality quizzes, step by step.

   Sections
     1.  Utilities
     2.  State + save/load
     3.  XP, levels and rewards
     4.  Catalog: themes, fonts, picture packs, extras
     5.  Picture art (inline SVG, no external files)
     6.  Lessons
     7.  Screen: Learn
     8.  Screen: Make (the step-by-step builder)
     9.  The quiz check (this is what pays XP)
     10. Screen: My Quizzes
     11. Screen: Shop (upgrades + quizzes other kids shared)
     12. Sharing: share codes in, share codes out
     13. Playing a quiz
     14. Boot
   ============================================================ */

/* ---------- 1. Utilities ---------- */
const $  = s => document.querySelector(s);
const $$ = s => Array.prototype.slice.call(document.querySelectorAll(s));
const screenEl = $('#screen');

function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
const clamp = (v,a,b) => v < a ? a : (v > b ? b : v);
const uid = () => Math.random().toString(36).slice(2,9);
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function plural(n, word){ return n + ' ' + word + (n === 1 ? '' : 's'); }
function words(s){ return String(s||'').trim().split(/\s+/).filter(Boolean); }

let toastTimer = null;
function toast(msg){
  const t = $('#toast');
  t.innerHTML = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

function modal(html){
  $('#modal').innerHTML = html;
  $('#modalWrap').classList.add('show');
  $('#modal').scrollTop = 0;
}
function closeModal(){ $('#modalWrap').classList.remove('show'); }
$('#modalWrap').addEventListener('click', e => { if (e.target.id === 'modalWrap') closeModal(); });

/* Copy text without any library. Falls back to select-and-prompt. */
function copyText(txt){
  let ok = false;
  try {
    const ta = document.createElement('textarea');
    ta.value = txt;
    ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select(); ta.setSelectionRange(0, txt.length);
    ok = document.execCommand('copy');
    document.body.removeChild(ta);
  } catch(_){ ok = false; }
  if (!ok && navigator.clipboard) {
    try { navigator.clipboard.writeText(txt); ok = true; } catch(_){}
  }
  return ok;
}

/* ---------- 2. State + save/load ---------- */
const STORE_KEY = 'quiz-kit-v1';

const DEFAULT_OWNED = ['theme-grape','theme-mint','font-rounded'];

let S = null;

function freshState(){
  return {
    v: 1,
    name: '',
    xp: 0,              // XP you can still spend
    earned: 0,          // every XP you ever earned — this is your level
    owned: DEFAULT_OWNED.slice(),
    lessons: {},        // lessonId -> true
    quizzes: [],        // the ones you made
    shelf: [],          // quizzes sitting in the shop (yours once shared, plus imported ones)
    bought: [],         // shelf quiz ids you have unlocked
    paid: {},           // quizId -> the check XP already handed out for it
    played: {},         // quizId -> true (first finish pays a little XP)
    sharedOnce: {},     // quizId -> true (the share bonus only lands once)
    draft: null,        // the quiz currently being built
    draftStep: 0,
    seeded: false
  };
}

function save(){
  try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch(_){ /* fine — it just won't outlive the page */ }
}
function load(){
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return false;
    const o = JSON.parse(raw);
    if (!o || typeof o !== 'object' || !Array.isArray(o.quizzes)) return false;
    S = Object.assign(freshState(), o);
    // anything the file added since this save was written
    DEFAULT_OWNED.forEach(id => { if (S.owned.indexOf(id) < 0) S.owned.push(id); });
    return true;
  } catch(_){ return false; }
}
function wipe(){
  try { localStorage.removeItem(STORE_KEY); } catch(_){}
}

const owns = id => S.owned.indexOf(id) >= 0;

/* ---------- 3. XP, levels and rewards ---------- */
const LEVELS = [
  { at:0,    title:'Brand New Quizzer' },
  { at:150,  title:'Question Asker' },
  { at:400,  title:'Quiz Apprentice' },
  { at:750,  title:'Result Writer' },
  { at:1200, title:'Quiz Builder' },
  { at:1800, title:'Quiz Designer' },
  { at:2600, title:'Quiz Boss' },
  { at:3600, title:'Quiz Legend' },
  { at:5000, title:'Grand Quizmaster' }
];
function levelInfo(){
  let i = 0;
  for (let k = 0; k < LEVELS.length; k++) if (S.earned >= LEVELS[k].at) i = k;
  const cur = LEVELS[i], next = LEVELS[i+1] || null;
  const span = next ? (next.at - cur.at) : 1;
  const into = next ? (S.earned - cur.at) : 1;
  return { n:i+1, title:cur.title, next:next, pct: next ? clamp(into/span,0,1)*100 : 100 };
}
function addXP(n, why){
  n = Math.round(n);
  if (n <= 0) return;
  const before = levelInfo().n;
  S.xp += n; S.earned += n;
  save(); paintTop();
  const after = levelInfo();
  if (after.n > before){
    setTimeout(() => modal(
      '<div class="center"><div style="font-size:54px">&#127881;</div>' +
      '<h3>Level ' + after.n + '</h3>' +
      '<p>You are now a <b>' + esc(after.title) + '</b>. Keep making quizzes — the shop has more to unlock.</p>' +
      '<div style="height:14px"></div>' +
      '<button class="btn wide" data-act="closeModal">Nice</button></div>'
    ), 450);
  }
  toast('+' + n + ' XP &middot; ' + why);
}
function spendXP(n){
  if (S.xp < n) return false;
  S.xp -= n; save(); paintTop(); return true;
}

function paintTop(){
  const L = levelInfo();
  $('#who').textContent = S.name ? (S.name + "'s Quiz Kit") : 'Quiz Kit';
  $('#rank').textContent = 'Level ' + L.n + ' · ' + L.title;
  $('#xpNum').textContent = S.xp;
  $('#lvlFill').style.width = L.pct + '%';
}

/* ---------- 4. Catalog ---------- */
/* Themes change how a quiz looks while somebody is taking it. */

function picSVG(packId, picId){
  const pack = ART[packId];
  if (!pack) return '';
  const p = pack.find(x => x.id === picId) || pack[0];
  return '<svg viewBox="0 0 100 76" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' + p.s + '</svg>';
}
function picName(packId, picId){
  const pack = ART[packId];
  if (!pack) return '';
  const p = pack.find(x => x.id === picId);
  return p ? p.name : '';
}
function ownedPacks(){ return PACKS.filter(p => owns(p.id) || (p.withExtra && owns(p.withExtra))); }

/* ---------- Router + one click handler for everything ---------- */
const ACT = {};              // data-act name -> function(el, a, b)
let route = { tab:'learn', page:'', arg:'' };

function go(tab, page, arg){
  route = { tab:tab, page:page || '', arg:arg == null ? '' : arg };
  render();
}
function render(){
  $$('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === route.tab));
  screenEl.scrollTop = 0;
  const map = { learn:renderLearn, make:renderMake, mine:renderMine, shop:renderShop };
  (map[route.tab] || renderLearn)();
}
$$('.tab').forEach(b => b.addEventListener('click', () => go(b.dataset.tab)));

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const fn = ACT[el.dataset.act];
  if (!fn) return;
  e.preventDefault();
  fn(el, el.dataset.a, el.dataset.b);
});
ACT.closeModal = closeModal;
ACT.tab = (el, a) => { closeModal(); go(a); };

function stepNav(back, next, nextLabel, nextAct){
  let h = '<div class="stepNav">';
  if (back) h += '<button class="btn ghost" data-act="stepBack">← Back</button>';

}

ACT.stepNext = () => {
  const step = S.draftStep || 0;
  const problem = stepProblem(step);
  if (problem){ toast(problem); return; }
  S.draftStep = clamp(step + 1, 0, 4);
  if (S.draftStep === 4) commitDraft();
  touch(); render();
};
function stepProblem(step){
  const q = D();
  if (step === 0 && !q.title.trim()) return 'Give your quiz a title first.';
  if (step === 1 && q.results.length < 2) return 'You need at least 2 results.';
  if (step === 2 && q.questions.length < 1) return 'Write at least one question.';
  return '';
}

/* ---------- 9. The quiz check — this is what pays XP ---------- */
const TESTY_WORDS = ['best','worst','correct','wrong','stupid','dumb','loser','smartest','obviously','silly'];

const CHECKS = [
  { id:'title', xp:6, label:'The quiz has a real title',
    tip:'Something better than "quiz" — three letters at least',
    test(q){
      const t = q.title.trim();
      return { ok: t.length >= 3 && t.toLowerCase() !== 'quiz',
               detail: t.length >= 3 ? '' : 'Go back to step 1 and name it.' };
    } },
  { id:'tagline', xp:4, label:'There is a line under the title',
    tip:'Tell people how long it takes',
    test(q){ return { ok: q.tagline.trim().length >= 5, detail:'One short line is enough, like "6 questions, no wrong answers."' }; } },
  { id:'results3', xp:10, label:'At least three results',
    tip:'Two feels like a coin flip',
    test(q){ return { ok: q.results.length >= 3, detail:'You have ' + plural(q.results.length,'result') + '.' }; } },
  { id:'blurbs', xp:12, label:'Every result is described properly',
    tip:'At least 25 letters of warm description each',
    test(q){
      const bad = q.results.filter(r => r.blurb.trim().length < 25);
      return { ok: q.results.length > 0 && !bad.length,
               detail: bad.length ? 'Still thin: ' + bad.map(r => r.name).join(', ') : '' };
    } },
  { id:'q5', xp:14, label:'Five questions or more',
    tip:'Fewer than five and the result feels random',
    test(q){ return { ok: q.questions.length >= 5, detail: 'You have ' + plural(q.questions.length,'question') + '.' }; } },
  { id:'opts3', xp:10, label:'Every question offers three answers or more',
    tip:'Two answers is a yes/no, not a personality question',
    test(q){
      const bad = q.questions.filter(x => x.opts.length < 3);
      return { ok: q.questions.length > 0 && !bad.length,
               detail: bad.length ? plural(bad.length,'question') + ' need more answers.' : '' };
    } },
  { id:'pointed', xp:10, label:'Every answer points at a result',
    tip:'An answer with nowhere to go is a wasted answer',
    test(q){
      let loose = 0;
      q.questions.forEach(x => x.opts.forEach(o => { if (!o.to || !resultById(q, o.to)) loose++; }));
      return { ok: !loose, detail: loose ? plural(loose,'answer') + ' still point nowhere.' : '' };
    } },
  { id:'reach', xp:8, label:'Every result can actually be won',
    tip:'If nothing points at a result, nobody can ever get it',
    test(q){
      const v = countVotes(q);
      const dead = q.results.filter(r => !v[r.id]);
      return { ok: q.results.length > 0 && !dead.length,
               detail: dead.length ? 'Nothing points at: ' + dead.map(r => r.name).join(', ') : '' };
    } },
  { id:'spread', xp:8, label:'No question where every answer is the same vote',
    tip:'Each question should split people up',
    test(q){
      const bad = q.questions.filter(x => {
        const set = {};
        x.opts.forEach(o => { if (o.to) set[o.to] = 1; });
        return Object.keys(set).length < 2;
      });
      return { ok: q.questions.length > 0 && !bad.length,
               detail: bad.length ? plural(bad.length,'question') + ' point everything at one result.' : '' };
    } },
  { id:'balance', xp:10, label:'The results are roughly balanced',
    tip:'The busiest result has at most 3 more answers than the quietest',
    test(q){
      if (!q.results.length || !q.questions.length) return { ok:false, detail:'' };
      const v = countVotes(q);
      const counts = q.results.map(r => v[r.id] || 0);
      const hi = Math.max.apply(null, counts), lo = Math.min.apply(null, counts);
      return { ok: hi - lo <= 3,
               detail: hi - lo <= 3 ? '' : 'Busiest has ' + hi + ' answers, quietest has ' + lo + '.' };
    } },
  { id:'notest', xp:8, label:'No "best" or "wrong" wording',
    tip:'Personality quizzes have no right answers — do not hint at one',
    test(q){
      const blob = (q.questions.map(x => x.text + ' ' + x.opts.map(o => o.t).join(' ')).join(' ')).toLowerCase();
      const found = TESTY_WORDS.filter(w => new RegExp('\\b' + w + '\\b').test(blob));
      return { ok: !found.length, detail: found.length ? 'Found: ' + found.join(', ') : '' };
    } }
];
const CHECK_MAX = CHECKS.reduce((a,c) => a + c.xp, 0);   // 100
const PERFECT_BONUS = 25;

function runCheck(q){
  const rows = CHECKS.map(c => {
    let r;
    try { r = c.test(q); } catch(_){ r = { ok:false, detail:'' }; }
    return { c:c, ok:!!r.ok, detail:r.detail || '' };
  });
  const score = rows.reduce((a,r) => a + (r.ok ? r.c.xp : 0), 0);
  return { rows:rows, score:score, max:CHECK_MAX };
}

/* ---------- 12. Sharing: codes out, codes in ---------- */
const SHARE_XP = 40, IMPORT_XP = 10;

function b64e(str){
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function b64d(s){
  s = s.replace(/-/g,'+').replace(/_/g,'/');
  while (s.length % 4) s += '=';
  const bin = atob(s);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
function packQuiz(q){
  return {
    t:q.title, g:q.tagline, c:q.cover, h:q.theme, f:q.font, s:q.shuffle ? 1 : 0, a:q.author,
    r:q.results.map(r => [r.id, r.name, r.emoji, r.blurb]),
    q:q.questions.map(x => [x.kind === 'pic' ? 1 : 0, x.text, x.pack || '', x.opts.map(o => [o.t, o.to, o.pic || ''])])
  };
}
function unpackQuiz(o){
  if (!o || !o.t || !Array.isArray(o.r) || !Array.isArray(o.q)) throw new Error('bad');
  return {
    id: uid(),
    title:String(o.t).slice(0,60), tagline:String(o.g||'').slice(0,90), cover:String(o.c||'🔮').slice(0,4),
    theme: themeById(o.h).id, font: fontById(o.f).id, shuffle: !!o.s,
    author:String(o.a||'A friend').slice(0,24),
    results:o.r.map(r => ({ id:String(r[0]), name:String(r[1]||'').slice(0,40), emoji:String(r[2]||'😄').slice(0,4), blurb:String(r[3]||'').slice(0,300) })),
    questions:o.q.map(x => ({
      id: uid(), kind: x[0] ? 'pic' : 'text', text:String(x[1]||'').slice(0,120),
      pack: ART[x[2]] ? x[2] : 'pack-shapes',
      opts:(x[3]||[]).map(o2 => ({ t:String(o2[0]||'').slice(0,90), to:String(o2[1]||''), pic:String(o2[2]||'') }))
    })),
    made: Date.now()
  };
}

const playEl = $('#playWrap');

function findQuiz(id, src){
  return (src === 'shelf' ? S.shelf : S.quizzes).find(x => x.id === id) ||
         S.quizzes.find(x => x.id === id) || S.shelf.find(x => x.id === id) ||
         (S.draft && S.draft.id === id ? S.draft : null);
}
ACT.playQuiz = (el, a, b) => {
  closeModal();
  const q = findQuiz(a, b);
  if (!q) return;
  if (!q.questions.length){ toast('This quiz has no questions yet.'); return; }
  const order = q.questions.map((_, i) => i);
  if (q.shuffle) order.sort(() => Math.random() - .5);
  P = { q:q, order:order, i:-1, tally:{}, src:b || 'own' };
  playEl.classList.remove('hide');
  paintPlay();
};
ACT.quitPlay = () => { playEl.classList.add('hide'); playEl.innerHTML = ''; P = null; render(); };

function paintPlay(){
  const q = P.q, th = themeById(q.theme), fo = fontById(q.font);
  const total = P.order.length;
  const pct = P.i < 0 ? 0 : (P.i / total) * 100;
  let body = '';

  if (P.i < 0){
    body = '<div class="qCard" style="background:' + th.card + ';color:' + th.ink + '">' +
           '<div style="font-size:56px;text-align:center">' + q.cover + '</div>' +
           '<div style="font-size:1.4rem;font-weight:800;text-align:center;line-height:1.25;margin-top:6px">' + esc(q.title) + '</div>' +
           (q.tagline ? '<div style="text-align:center;opacity:.75;margin-top:6px;font-size:.9rem">' + esc(q.tagline) + '</div>' : '') +
           '<div style="text-align:center;opacity:.6;margin-top:10px;font-size:.8rem">' +
             plural(total,'question') + ' · ' + plural(q.results.length,'possible result') + ' · by ' + esc(q.author) + '</div>' +
           '<div style="height:16px"></div>' +
           '<button class="ansBtn" style="text-align:center;font-weight:800;background:' + th.top + ';color:#fff;border-color:transparent" data-act="playNext">Start ▶</button>' +
           '</div>';
  } else if (P.i < total){
    const qq = q.questions[P.order[P.i]];
    body = '<div class="qCard" style="background:' + th.card + ';color:' + th.ink + '">' +
           '<div class="qNum">Question ' + (P.i+1) + ' of ' + total + '</div>' +
           '<div class="qText">' + esc(qq.text) + '</div>';
    if (qq.kind === 'pic'){
      body += '<div class="picGrid">' + qq.opts.map((o, i) =>
        '<button class="ansBtn" data-act="answer" data-a="' + i + '">' +
        picSVG(qq.pack, o.pic) + '<div class="cap">' + esc(o.t) + '</div></button>').join('') + '</div>';
    } else {
      body += qq.opts.map((o, i) =>
        '<button class="ansBtn" data-act="answer" data-a="' + i + '">' + esc(o.t) + '</button>').join('');
    }
    body += '</div>';
  } else {
    body = resultHTML(th, fo);
  }

  playEl.style.background = th.bg;
  playEl.innerHTML =
    '<div class="playTop" style="color:#fff">' +
      '<button class="xBtn" data-act="quitPlay">✕</button>' +
      '<div class="pgTrack"><span class="pgFill" style="width:' + pct + '%"></span></div>' +
      '<div style="font-size:.78rem;font-weight:800;min-width:38px;text-align:right">' +
        (P.i < 0 ? '' : (P.i >= total ? 'Done' : (P.i+1) + '/' + total)) + '</div>' +
    '</div>' +
    '<div class="playBody" style="font-family:' + fo.css + '">' + body + '</div>';
  playEl.querySelector('.playBody').scrollTop = 0;
}
ACT.playNext = () => { P.i++; paintPlay(); };
ACT.answer = (el, a) => {
  const qq = P.q.questions[P.order[P.i]];
  const o = qq.opts[+a];
  if (o && o.to) P.tally[o.to] = (P.tally[o.to] || 0) + 1;
  P.i++;
  if (P.i >= P.order.length) finishPlay();
  paintPlay();
};
function winner(){
  const q = P.q;
  let best = null, bestN = -1;
  q.results.forEach(r => {
    const n = P.tally[r.id] || 0;
    if (n > bestN){ bestN = n; best = r; }
  });
  return best || q.results[0] || { name:'No result', emoji:'🤷', blurb:'This quiz has no results wired up yet.' };
}
function finishPlay(){
  const id = P.q.id;
  if (!S.played[id]){ S.played[id] = true; save(); setTimeout(() => addXP(5, 'quiz finished'), 400); }
}
function resultHTML(th, fo){
  const q = P.q, r = winner();
  const total = P.order.length;
  const mine = S.quizzes.some(x => x.id === q.id);
  let h = '<div class="qCard" style="background:' + th.card + ';color:' + th.ink +
          (q.sparkle ? ';box-shadow:0 0 0 3px rgba(255,255,255,.55), 0 0 38px rgba(255,255,255,.6)' : '') + '">' +
    (q.sparkle ? '<div style="text-align:center;font-size:20px;letter-spacing:6px;opacity:.85">✨ ✨ ✨</div>' : '') +
    '<div style="text-align:center;font-size:.76rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;opacity:.6">You got</div>' +
    '<div class="resultBig">' + r.emoji + '</div>' +
    '<div style="font-size:1.45rem;font-weight:800;text-align:center;line-height:1.2">' + esc(r.name) + '</div>' +
    '<div style="height:10px"></div>' +
    '<div style="font-size:.95rem;line-height:1.6;text-align:center">' + esc(r.blurb || '') + '</div>' +
    '<div style="height:14px"></div>' +
    '<div style="font-size:.76rem;opacity:.65;text-align:center">How your ' + plural(total,'answer') + ' landed</div>' +
    '<div style="height:8px"></div>';
  q.results.forEach(rr => {
    const n = P.tally[rr.id] || 0;
    const pct = total ? Math.round((n/total)*100) : 0;
    h += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:.82rem">' +
         '<div style="width:22px">' + rr.emoji + '</div>' +
         '<div style="flex:1 1 auto;height:8px;border-radius:99px;background:rgba(0,0,0,.1);overflow:hidden">' +
         '<span style="display:block;height:100%;width:' + pct + '%;background:' + th.top + '"></span></div>' +
         '<div style="width:30px;text-align:right;opacity:.7">' + n + '</div></div>';
  });
  h += '</div>';
  h += '<button class="ansBtn" style="text-align:center;font-weight:800" data-act="replay">Take it again</button>';
  if (mine) h += '<button class="ansBtn" style="text-align:center;font-weight:800" data-act="shareFromPlay" data-a="' + q.id + '">Share this quiz</button>';
  h += '<button class="ansBtn" style="text-align:center;font-weight:800;background:rgba(255,255,255,.35);color:#fff;border-color:rgba(255,255,255,.5)" data-act="quitPlay">Close</button>';
  return h;
}
ACT.replay = () => {
  const order = P.q.questions.map((_, i) => i);
  if (P.q.shuffle) order.sort(() => Math.random() - .5);
  P.i = -1; P.tally = {}; P.order = order; paintPlay();
};
ACT.shareFromPlay = (el, a) => { ACT.quitPlay(); go('mine'); setTimeout(() => ACT.shareQuiz(null, a), 60); };

/* ---------- 15. Name + boot ---------- */
function askName(){
  modal(
    '<h3>🔮 Welcome to Quiz Kit</h3>' +
    '<p>Make your own personality quizzes, learn how in the lessons, earn XP and spend it in the shop.</p>' +
    '<p style="margin-top:8px">What should we call you? A nickname is fine — this only ever shows up on quizzes you make.</p>' +
    '<div style="height:12px"></div>' +
    '<input class="tf" id="nameIn" maxlength="24" placeholder="Quizmaker" value="' + esc(S.name) + '">' +
    '<div style="height:14px"></div>' +
    '<button class="btn wide" data-act="saveName">That is me</button>'
  );
  setTimeout(() => { const n = $('#nameIn'); if (n) n.focus(); }, 250);
}
ACT.saveName = () => {
  const v = ($('#nameIn').value || '').trim();
  S.name = v || 'Quizmaker';
  S.quizzes.forEach(q => { if (q.author === 'Someone') q.author = S.name; });
  save(); closeModal(); paintTop(); render();
};

function boot(){
  if (!load()) S = freshState();
  if (!S.sharedOnce) S.sharedOnce = {};
  if (typeof S.draftStep !== 'number') S.draftStep = 0;
  seedShelf();
  paintTop();
  go(S.draft ? 'make' : 'learn');
  if (!S.name) askName();
}
boot();

})();
