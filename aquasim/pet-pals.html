    if (pct) pct.textContent = v + '%';
    const btn = $('care-' + k);
    if (btn) btn.classList.toggle('urgent', v < 45);
  });
  const b = $('bubble'); if (b) b.textContent = bubbleFor(p);
  const art = $('petart');
  if (art) { const m = moodOf(p); art.className = 'petart ' + m.cls; }
}

function doCare(needKey) {
  const p = activePet();
  const sp = getSp(p.sp);
  const before = p.needs[needKey];

  askQuestion({
    title: sp.needs[needKey].label,
    sub: `${p.name} the ${sp.famName.toLowerCase()}`,
    spId: p.sp,
    needKey,
    onDone: (ok) => {
      closeModal();
      p.cared++;
      if (ok) {
        p.needs[needKey] = 100;
        let gain = 3 + treatBonus();
        if (before < 30) gain += 2;
        S.streak++;
        S.correct++;
        if (S.streak > S.bestStreak) S.bestStreak = S.streak;
        if (S.streak > 0 && S.streak % 5 === 0) { gain += 5; toast(`🔥 ${S.streak} in a row! Bonus treats.`, 'good'); }
        addTreats(gain);
        floatUp('+' + gain + '🦴', '#ffd27a');
        // good care lifts wellbeing a little across the board
        NEED_KEYS.forEach(k => { if (k !== needKey) p.needs[k] = clamp(p.needs[k] + 3, 0, 100); });
      } else {
        p.needs[needKey] = clamp(before + 32, 0, 100);
        S.streak = 0;
        toast('No treats this time — but now you know.', 'bad');
      }
      S.answered++;
      renderPet();
      updateNavDots();
    }
  });
}

function makeJob() {
  const st = stubAt(Math.floor(Math.random() * TOTAL_SPECIES));
  const spId = st.key;
  const pay = 2 + st.diff + TIERS[st.tier].pay;   // harder and rarer animals pay more
  return {
    id: 'j' + Math.random().toString(36).slice(2, 8),
    friend: pick(FRIENDS),
    petName: pick(PETNAMES),
    sp: spId,
    note: pick(JOB_NOTES),
    pay
  };
}

function refillJobs() { while (S.jobs.length < 3) S.jobs.push(makeJob()); }

function renderSit() {
  refillJobs();
  let html = `
    <div class="panel">
      <h2>Pet-sitting 🤝</h2>
      <p class="sub">Your friends need someone they can trust. Look after their animal properly and they will thank you in 💖 hearts — the currency the market and the habitats run on. Harder species pay more, and you can sit for animals you have never owned.</p>
      <div class="chips">
        <span class="chip good">💖 ${S.hearts} hearts</span>
        <span class="chip">🤝 ${S.jobsDone} jobs done</span>
        <span class="chip">⭐ ${S.perfectJobs} perfect</span>
      </div>
    </div>
    <div class="panel">
      <h3>Job board</h3>`;
  S.jobs.forEach((j, i) => {
    const sp = getSp(j.sp);
    html += `
      <div class="job">
        <canvas class="portrait mini" width="90" height="62" data-sp="${j.sp}" style="flex:0 0 58px;width:58px"></canvas>
        <div class="jb">
          <div class="jn">${esc(j.friend)}'s ${esc(sp.famName.toLowerCase())}, ${esc(j.petName)}</div>
          <div class="jd">${esc(sp.name)} · ${esc(j.friend)} is ${esc(j.note)}. Care difficulty ${stars(sp.diff)}</div>
        </div>
        <button class="btn pink small" data-job="${i}">💖 ${j.pay}</button>
      </div>`;
  });
  html += `
      <div class="hr"></div>
      <div class="sub">Every sitting job is three real care decisions about that species. Three out of three pays double.</div>
    </div>`;
  $('screen').innerHTML = html;
  paintPortraits();
  document.querySelectorAll('[data-job]').forEach(el => {
    el.onclick = () => startJob(+el.getAttribute('data-job'));
  });
}

function startJob(idx) {
  const job = S.jobs[idx];
  S.met[job.sp] = true;
  S.jobSession = { job, idx, round: 0, right: 0, keys: shuffle(NEED_KEYS).slice(0, 3) };
  nextJobRound();
}

function nextJobRound() {
  const s = S.jobSession;
  const sp = getSp(s.job.sp);
  if (s.round >= 3) return finishJob();
  const key = s.keys[s.round];
  askQuestion({
    title: `${s.job.petName} · ${sp.needs[key].label}`,
    sub: `Sitting for ${s.job.friend} — decision ${s.round + 1} of 3`,
    spId: s.job.sp,
    needKey: key,
    onDone: (ok) => {
      if (ok) s.right++;
      s.round++;
      S.answered++;
      if (ok) S.correct++;
      nextJobRound();
    }
  });
}

function finishJob() {
  const s = S.jobSession;
  const job = s.job;
  const sp = getSp(job.sp);
  let pay, verdict, kind;
  if (s.right === 3) { pay = job.pay * 2; verdict = `Perfect. ${job.friend} says ${job.petName} has never been happier.`; kind = 'good'; S.perfectJobs++; }
  else if (s.right === 2) { pay = job.pay; verdict = `Good sitting. One thing to read up on before next time.`; kind = 'good'; }
  else if (s.right === 1) { pay = Math.max(1, Math.round(job.pay / 2)); verdict = `${job.petName} is fine, but ${job.friend} had to fix a couple of things.`; kind = ''; }
  else { pay = 1; verdict = `${job.petName} came through it — but read the ${sp.famName} guide before you sit again.`; kind = 'bad'; }

  S.jobsDone++;
  S.jobs.splice(s.idx, 1);
  refillJobs();
  addHearts(pay);

  openModal(`
    <div class="center">
      <canvas class="portrait" width="180" height="120" data-sp="${job.sp}" style="max-width:200px;margin:0 auto"></canvas>
      <h2>${s.right} / 3 right</h2>
      <p class="sub">${esc(verdict)}</p>
      <div class="chip hearts" style="background:#ffe3ec;color:var(--pink-d);display:inline-block;font-size:16px;padding:9px 18px;margin:8px 0">+${pay} 💖</div>
    </div>
    <div class="hr"></div>
    <div class="rowbtns">
      <button class="btn ghost" id="jobGuide">📖 Read the ${esc(sp.famName)} guide</button>
      <button class="btn" id="jobClose">Done</button>
    </div>
  `);
  paintPortraits($('sheet'));
  $('jobClose').onclick = () => { closeModal(); S.jobSession = null; renderAll(); };
  $('jobGuide').onclick = () => { S.jobSession = null; openGuideModal(job.sp); };
}

/* Open a single stall's counter */
function openStall(st) {
  const ids = st.items;
  let rows = '';
  ids.forEach(id => {
    const inT = TREAT_SHOP.find(x => x.id === id);
    const it = inT || HEART_SHOP.find(x => x.id === id);
    if (!it) return;
    const isTreat = !!inT;
    const cur = isTreat ? S.treats : S.hearts;
    const sym = isTreat ? '🦴' : '💖';
    const owned = !it.repeat && S.own[it.id];
    const worn = it.cosmetic && S.wearing[it.cosmetic] === it.e;
    let btn;
    if (owned && it.cosmetic) btn = `<button class="price ${worn ? 'owned' : ''}" data-wear="${it.id}" style="${worn ? '' : 'background:var(--accent);color:#fff'}">${worn ? 'Worn' : 'Wear'}</button>`;
    else if (owned) btn = `<span class="price owned">Owned ✓</span>`;
    else btn = `<button class="btn small ${isTreat ? 'gold' : 'pink'}" data-buy="${it.id}" ${cur < it.cost ? 'disabled' : ''}>${sym} ${it.cost}</button>`;
    rows += `<div class="item"><div class="e">${it.e}</div>
      <div class="ib"><div class="iname">${esc(it.name)}</div><div class="idesc">${esc(it.desc)}</div></div>${btn}</div>`;
  });

  openModal(`
    <div style="display:flex;align-items:center;gap:11px;margin-bottom:6px">
      <div style="font-size:32px">${st.icons[0]}</div>
      <div style="flex:1"><h2 style="margin:0">${esc(st.name)}</h2>
      <div class="sub">🦴 ${S.treats} treats · 💖 ${S.hearts} hearts</div></div>
    </div>
    <div class="hr"></div>
    ${rows}
    <div class="rowbtns" style="margin-top:8px"><button class="btn wide" id="stallClose">Back to the market</button></div>
  `);
  const rewire = () => { closeModal(); openStall(st); };
  $('sheet').querySelectorAll('[data-buy]').forEach(el => {
    el.onclick = () => { buyItem(el.getAttribute('data-buy'), true); rewire(); };
  });
  $('sheet').querySelectorAll('[data-wear]').forEach(el => {
    el.onclick = () => {
      const it = TREAT_SHOP.find(x => x.id === el.getAttribute('data-wear'));
      S.wearing[it.cosmetic] = (S.wearing[it.cosmetic] === it.e) ? null : it.e;
      rewire();
    };
  });
  $('stallClose').onclick = closeModal;
}

function buyItem(id, fromStall) {
  const inTreats = TREAT_SHOP.find(x => x.id === id);
  const it = inTreats || HEART_SHOP.find(x => x.id === id);
  if (!it) return;
  const isTreat = !!inTreats;
  const have = isTreat ? S.treats : S.hearts;
  if (have < it.cost) { toast('Not enough yet.', 'bad'); return; }
  if (isTreat) { S.treats -= it.cost; bumpCoin('treats'); } else { S.hearts -= it.cost; bumpCoin('hearts'); }
  updatePurse();

  const p = activePet();
  if (it.id === 'snack' && p) {
    NEED_KEYS.forEach(k => p.needs[k] = clamp(p.needs[k] + 18, 0, 100));
    toast('Snacks all round!', 'good');
  } else if (it.id === 'crate' && p) {
    NEED_KEYS.forEach(k => p.needs[k] = 100);
    toast(`${p.name} is completely sorted.`, 'good');
  } else {
    S.own[it.id] = true;
    if (it.cosmetic) { S.wearing[it.cosmetic] = it.e; toast(`${it.name} — looking sharp.`, 'good'); }
    else toast(`${it.name} installed.`, 'good');
  }
  if (!fromStall) renderMarket();
}

function famsIn(habId) { return FAM_IDS.filter(f => FAMILIES[f].habitat === habId); }
function ownedInFam(famId) { return S.pets.filter(p => getSp(p.sp).fam === famId).length; }

/* Pick an unowned creature living in this habitat. With 10,000 entries the
   habitats never run dry — the rarer lines just turn up far less often. */
function rollCreature(habId) {
  const fams = famsIn(habId);
  const perFam = Math.ceil(VARIANT_N / FAM_N);
  for (let tries = 0; tries < 80; tries++) {
    const f = pick(fams);
    const famPos = FAM_IDS.indexOf(f);
    let i;
    if (Math.random() < 0.04) i = famPos;                 // the documented species itself
    else i = FAM_N + Math.floor(Math.random() * perFam) * FAM_N + famPos;
    if (i >= TOTAL_SPECIES) continue;
    const tier = tierAt(i);
    if (tier === 'legendary' && Math.random() < 0.75) continue;
    if (tier === 'rare' && Math.random() < 0.40) continue;
    const key = keyAt(i);
    if (!S.pets.some(p => p.sp === key)) return key;
  }
  return null;
}

function renderHabitat() {
  if (S.coax) return renderCoax();

  let html = `

      <p class="sub">Spend 💖 hearts to open a habitat, then spend a few more coaxing whatever lives there. You cannot buy an animal here. You earn its trust by proving you know what it needs — and if you get it right often enough, it comes home with you.</p>
      <div class="chips"><span class="chip good">💖 ${S.hearts} hearts</span><span class="chip">🐾 ${S.pets.length} pet${S.pets.length === 1 ? '' : 's'} at home</span></div>
    </div>`;

  HABITATS.forEach(h => {
    const open = !!S.habOpen[h.id];
    html += `
      <div class="panel tight" style="margin-bottom:10px">

          <div style="font-size:38px">${h.emoji}</div>
          <div style="flex:1;min-width:0">
            <div style="font-weight:800;font-size:15px">${esc(h.name)}</div>
            <div class="sub" style="font-size:12px">${esc(h.blurb)}</div>
          </div>
          ${open
            ? `<button class="btn small green" data-visit="${h.id}">Visit</button>`
            : `<button class="btn small pink" data-open="${h.id}" ${S.hearts < h.cost ? 'disabled' : ''}>💖 ${h.cost}</button>`}
        </div>
        ${open ? `<div class="chips" style="margin-top:9px">${
            famsIn(h.id).map(f => {
              const n = ownedInFam(f);
              return `<span class="chip ${n ? 'good' : ''}">${FAMILIES[f].emoji} ${esc(FAMILIES[f].name)}${n ? ' ×' + n : ''}</span>`;
            }).join('')
          }</div>` : ''}
      </div>`;
  });

  $('screen').innerHTML = html;
  document.querySelectorAll('[data-open]').forEach(el => {
    el.onclick = () => {
      const h = HABITATS.find(x => x.id === el.getAttribute('data-open'));
      if (S.hearts < h.cost) return;
      S.hearts -= h.cost; bumpCoin('hearts'); updatePurse();
      S.habOpen[h.id] = true;
      toast(`${h.name} is open. Go carefully.`, 'good');

  });
  document.querySelectorAll('[data-visit]').forEach(el => {
    el.onclick = () => enterHabitat(el.getAttribute('data-visit'));
  });

function enterHabitat(habId) {
  const spId = rollCreature(habId);
  if (!spId) { toast('Nothing stirs today. Try again.'); return; }

function renderCoax() {

    <div class="panel">
      <h3>${sp.emoji} ${esc(sp.name)}</h3>

      <div class="chips" style="margin-bottom:12px">

      </div>
      <div class="rowbtns" style="margin-top:8px">

        <button class="btn ghost small" id="coaxLeave">Leave quietly</button>

  if (c.adopting) { $('coaxFinish').onclick = () => adoptWild(); }
  else $('coaxGo').onclick = coaxAttempt;

  $('coaxLeave').onclick = () => { S.coax = null; stopRoom(); renderHabitat(); };

/* One coaxing attempt — reachable from the button or by pressing E in the room */
function coaxAttempt() {
  const c = S.coax;
  if (!c || c.adopting) return;
  if (S.hearts < COAX_COST) { toast('Not enough hearts for another offering.', 'bad'); return; }
  const sp = getSp(c.sp);
  const h = HABITATS.find(x => x.id === c.hab);
  if (Math.abs(R.player.x - (R.actors[0] ? R.actors[0].x : 999)) > 150) {
    toast('Too far away. Walk closer first.');
    return;
  }
  S.hearts -= COAX_COST; bumpCoin('hearts'); updatePurse();
  c.tries++;
  const key = pick(NEED_KEYS);
  askQuestion({
    title: `The ${sp.famName.toLowerCase()} is watching`,
    sub: `${h.name} · ${sp.needs[key].label}`,
    spId: c.sp,
    needKey: key,
    onDone: (ok) => {
      closeModal();
      S.answered++;
      if (ok) { S.correct++; c.trust = clamp(c.trust + TIERS[sp.tier].trust, 0, 100); toast('It edges closer.', 'good'); popText(R.player.x, R.player.y - 50, '💗', '#ff9ec0'); }
      else { c.trust = clamp(c.trust + 6, 0, 100); toast('It backs off a little.', 'bad'); }
      if (c.trust >= 100) adoptWild();
      else renderHabitat();
    }
  });
}

function adoptWild() {
  const c = S.coax;
  const sp = getSp(c.sp);
  c.adopting = true;   // stops the coax button re-firing if the modal is dismissed
  openModal(`

    </div>
    <label style="font-size:13px;font-weight:800">Give them a name</label>
    <input id="wildName" maxlength="16" placeholder="e.g. ${esc(pick(PETNAMES))}" autocomplete="off" spellcheck="false"
      style="width:100%;font:inherit;font-size:16px;padding:11px 13px;border-radius:13px;border:3px solid var(--line);margin:6px 0 12px;background:var(--panel2);color:var(--ink)">
    <button class="btn wide green" id="wildOk">Take them home 💚</button>

  };
}

function guideHTML(spId) {
  const sp = getSp(spId);
  let html = `
    <div style="display:flex;align-items:center;gap:12px">
      <canvas class="portrait" width="140" height="96" data-sp="${sp.key}" style="width:96px;flex:0 0 96px"></canvas>

      ${Object.keys(sp.facts).map(k => `<div class="fact"><div class="k">${esc(k)}</div><div class="v">${esc(sp.facts[k])}</div></div>`).join('')}
    </div>`;
  sp.guide.forEach((g, i) => {
    html += `
      <div class="gsec ${g.danger ? 'danger' : ''} ${i === 0 ? 'open' : ''}">
        <div class="gh" data-gsec="1">${g.i} <span>${esc(g.h)}</span><span class="arrow">▾</span></div>
        <div class="gb"><ul>${g.li.map(l => `<li>${l}</li>`).join('')}</ul></div>
      </div>`;
  });
  return html;
}

function wireGuideAccordion(root) {
  root.querySelectorAll('[data-gsec]').forEach(h => {
    h.onclick = () => h.parentElement.classList.toggle('open');
  });
}

function openGuideModal(spId) {
  openModal(guideHTML(spId) + `<div class="rowbtns" style="margin-top:10px"><button class="btn wide" id="gClose">Close</button></div>`);
  wireGuideAccordion($('sheet'));
  paintPortraits($('sheet'));
  $('gClose').onclick = closeModal;
}

function renderGuide(keepFocus) {
  const sel = S.guideSp || (activePet() ? activePet().sp : STARTER_FAMS[0]);
  S.guideSp = sel;
  const list = filteredStubs({ startersOnly: false });
  const metN = Object.keys(S.met).length;

  let html = `
    <div class="panel">
      <h2>Care library 📖</h2>
      <p class="sub">Everything the game asks you comes from these pages. Read them before you adopt, before you sit, and before you go looking for something in a habitat.</p>
      <div class="sub" style="margin-bottom:8px"><b>How the codex works:</b> twelve <b>documented families</b> carry all the husbandry. The other ${VARIANT_N.toLocaleString()} entries are breeds, morphs and colour lines within those families — a ${esc(FAMILIES.cornsnake.name)} morph is still a ${esc(FAMILIES.cornsnake.name.toLowerCase())}. Different looks, identical care.</div>
      <div class="chips" style="margin-bottom:10px">
        <span class="chip">📚 ${metN.toLocaleString()} / ${TOTAL_SPECIES.toLocaleString()} met</span>
        <span class="chip good">🐾 ${S.pets.length} kept</span>
      </div>
      <div class="hr"></div>
      ${browserHTML(list, { startersOnly: false })}
    </div>
    <div class="panel" id="guideBody">${guideHTML(sel)}</div>`;

  $('screen').innerHTML = html;
  wireBrowser(renderGuide);
  restoreSearchFocus(keepFocus);
  document.querySelectorAll('[data-choose]').forEach(el => {
    el.onclick = () => { S.guideSp = el.getAttribute('data-choose'); S.chooserSel = el.getAttribute('data-choose'); renderGuide(); document.getElementById('guideBody').scrollIntoView({ behavior: 'smooth', block: 'start' }); };
  });
  wireGuideAccordion($('guideBody'));
}

/* ============================================================
   NAV + ROUTER
   ============================================================ */

const TABS = [
  { id: 'pet',     ico: '🐾', label: 'My Pet' },
  { id: 'sit',     ico: '🤝', label: 'Pet-Sit' },
  { id: 'market',  ico: '🛒', label: 'Market' },
  { id: 'habitat', ico: '🌿', label: 'Habitat' },
  { id: 'guide',   ico: '📖', label: 'Guide' }
];

function renderNav() {
  if (!S.started) { $('nav').style.display = 'none'; return; }
  $('nav').style.display = 'flex';
  $('nav').innerHTML = `<div class="nav-inner">${TABS.map(t => `
    <button data-tab="${t.id}" class="${S.screen === t.id ? 'active' : ''}">
      <span class="ico">${t.ico}</span>${t.label}
      ${t.id === 'pet' && S.pets.some(needsAttention) ? '<span class="dot"></span>' : ''}
    </button>`).join('')}</div>`;
  document.querySelectorAll('[data-tab]').forEach(el => {
    el.onclick = () => { S.screen = el.getAttribute('data-tab'); renderAll(); window.scrollTo({ top: 0 }); };
  });
}

function updateNavDots() { renderNav(); }

function renderAll() {
  updatePurse();
  renderNav();
  stopRoom();
  if (!S.started) { renderChooser(); return; }
  if (S.screen === 'pet') renderPet();
  else if (S.screen === 'sit') renderSit();
  else if (S.screen === 'market') renderMarket();
  else if (S.screen === 'habitat') renderHabitat();
  else if (S.screen === 'guide') renderGuide();
}

/* ============================================================
   TICK — needs drain in real time
   ============================================================ */

let last = Date.now();
setInterval(() => {
  const now = Date.now();
  const dt = Math.min((now - last) / 1000, 5);
  last = now;
  if (!S.started || $('modal').classList.contains('on')) return;

  let anyLow = false;
  S.pets.forEach((p, i) => {
    const sp = getSp(p.sp);
    const focus = (i === S.active) ? 1 : 0.6;
    NEED_KEYS.forEach(k => {
      const drop = DECAY_BASE * sp.needs[k].rate * slowFactor(k) * focus * dt;
      p.needs[k] = clamp(p.needs[k] - drop, 0, 100);
    });
    // neglected basics wear down health faster
    const starving = NEED_KEYS.filter(k => k !== 'health' && p.needs[k] < 10).length;
    if (starving) p.needs.health = clamp(p.needs.health - DECAY_BASE * starving * dt, 0, 100);
    if (S.own.vet) p.needs.health = Math.max(p.needs.health, 25);
    if (needsAttention(p)) anyLow = true;
  });

  if (S.screen === 'pet') refreshBars();
  const navDot = document.querySelector('.nav .dot');
  if (anyLow && !navDot) renderNav();
  if (!anyLow && navDot) renderNav();
}, 1000);

/* ============================================================
   GO
   ============================================================ */

updatePurse();
renderAll();

})();
</script>
</body>
</html>
