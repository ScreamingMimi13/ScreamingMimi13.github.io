<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pet Pals — Care Academy</title>
<style>
  :root {
    --bg1: #ffd9a8;
    --bg2: #9fd8f2;
    --bg3: #c8b6f5;
    --panel: #ffffff;
    --panel2: #f6f2ff;
    --ink: #33294a;
    --muted: #7d7396;
    --line: #e8e2f5;
    --good: #2fae6d;
    --good-d: #1e8a53;
    --bad: #e8574e;
    --bad-d: #c33f38;
    --warn: #f0a02a;
    --accent: #7e57c2;
    --accent-d: #5e3ba0;
    --pink: #ff6f9c;
    --pink-d: #d94b78;
    --treat: #f7a634;
    --treat-d: #d1811a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; min-height: 100%; }
  body {
    font-family: "Baloo 2", "Comic Sans MS", "Chalkboard SE", "Trebuchet MS", system-ui, sans-serif;
    background: linear-gradient(165deg, var(--bg1), var(--bg2) 48%, var(--bg3));
    background-attachment: fixed;
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    user-select: none;
    overflow-x: hidden;
  }
  .wrap {
    width: 100%;
    max-width: 600px;
    padding: 12px 12px 96px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  /* ---------- Top bar ---------- */
  .topbar { display: flex; align-items: center; gap: 8px; color: #fff; }
  .brand {
    flex: 1; font-size: 21px; font-weight: 800; letter-spacing: .2px;
    text-shadow: 0 2px 0 rgba(0,0,0,.2); line-height: 1.1;
  }
  .brand small { display: block; font-size: 11px; font-weight: 700; opacity: .9; letter-spacing: .6px; }
  .purse { display: flex; gap: 6px; }
  .coin {
    font-weight: 800; font-size: 14px; padding: 7px 12px; border-radius: 999px;
    display: flex; align-items: center; gap: 5px; white-space: nowrap;
    transition: transform .14s ease;
  }
  .coin.bump { transform: scale(1.22); }
  .coin.treats { background: linear-gradient(180deg,#ffd98a,var(--treat)); color: #5a3800; box-shadow: 0 3px 0 var(--treat-d); }
  .coin.hearts { background: linear-gradient(180deg,#ffa8c4,var(--pink)); color: #61122f; box-shadow: 0 3px 0 var(--pink-d); }

  /* ---------- Panels ---------- */
  .panel {
    background: var(--panel); border-radius: 20px; padding: 16px;
    box-shadow: 0 12px 28px rgba(40,20,80,.22);
  }
  .panel.tight { padding: 12px; }
  h2 { margin: 0 0 4px; font-size: 19px; }
  h3 { margin: 0 0 6px; font-size: 15px; }
  p { margin: 0 0 8px; line-height: 1.5; font-size: 14px; }
  .sub { color: var(--muted); font-size: 13px; line-height: 1.45; }
  .hr { height: 2px; background: var(--line); border-radius: 2px; margin: 12px 0; }

  /* ---------- Buttons ---------- */
  button { font: inherit; cursor: pointer; border: none; }
  .btn {
    background: linear-gradient(180deg, #9b78d8, var(--accent));
    color: #fff; font-weight: 800; font-size: 15px;
    padding: 11px 18px; border-radius: 14px; box-shadow: 0 4px 0 var(--accent-d);
    transition: transform .08s ease, box-shadow .08s ease;
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--accent-d); }
  .btn.wide { width: 100%; }
  .btn.pink { background: linear-gradient(180deg,#ff96b6,var(--pink)); box-shadow: 0 4px 0 var(--pink-d); }
  .btn.gold { background: linear-gradient(180deg,#ffd07a,var(--treat)); color:#5a3800; box-shadow: 0 4px 0 var(--treat-d); }
  .btn.green { background: linear-gradient(180deg,#5fd39a,var(--good)); box-shadow: 0 4px 0 var(--good-d); }
  .btn.ghost { background: var(--panel2); color: var(--accent-d); box-shadow: 0 3px 0 var(--line); }
  .btn[disabled] { filter: grayscale(.7); opacity: .55; pointer-events: none; }
  .btn.small { font-size: 13px; padding: 8px 13px; border-radius: 11px; }

  /* ---------- Nav ---------- */
  .nav {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
    display: flex; justify-content: center;
    background: linear-gradient(180deg, rgba(255,255,255,0), rgba(60,40,100,.28));
    padding: 8px 10px 10px;
    backdrop-filter: blur(3px);
  }
  .nav-inner {
    width: 100%; max-width: 600px; display: flex; gap: 6px;
    background: var(--panel); border-radius: 18px; padding: 6px;
    box-shadow: 0 8px 22px rgba(40,20,80,.3);
  }
  .nav button {
    flex: 1; background: transparent; color: var(--muted); font-weight: 800;
    font-size: 10.5px; padding: 7px 2px 6px; border-radius: 13px; line-height: 1.15;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
  }
  .nav button .ico { font-size: 19px; line-height: 1; }
  .nav button.active { background: var(--panel2); color: var(--accent-d); }
  .nav button .dot {
    position: absolute; margin: -22px 0 0 20px; width: 9px; height: 9px;
    border-radius: 50%; background: var(--bad); box-shadow: 0 0 0 2px #fff;
  }

  /* ---------- Pet scene ---------- */
  .scene {
    position: relative; height: 208px; border-radius: 18px; overflow: hidden;
    display: flex; align-items: flex-end; justify-content: center;
    box-shadow: inset 0 -18px 34px rgba(0,0,0,.14);
  }
  .scene .floor { position: absolute; left: 0; right: 0; bottom: 0; height: 42px; background: rgba(0,0,0,.14); }
  .scene .sun { position: absolute; top: 14px; right: 18px; font-size: 26px; opacity: .8; }
  .petart {
    position: relative; font-size: 92px; line-height: 1; margin-bottom: 30px;
    animation: bob 2.6s ease-in-out infinite; filter: drop-shadow(0 8px 8px rgba(0,0,0,.25));
  }
  .petart.sad { animation: droop 3.4s ease-in-out infinite; }
  .petart.happy { animation: hop .7s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-10px) rotate(2deg); } }
  @keyframes hop { 0%,100% { transform: translateY(0) scale(1); } 40% { transform: translateY(-22px) scale(1.06); } }
  @keyframes droop { 0%,100% { transform: translateY(6px) rotate(0deg) scale(.94); } 50% { transform: translateY(10px) rotate(-3deg) scale(.93); } }
  .accessory { position: absolute; font-size: 34px; pointer-events: none; }
  .acc-head { top: -12px; left: 50%; transform: translateX(-46%); }
  .acc-neck { bottom: 4px; left: 50%; transform: translateX(-50%); font-size: 28px; }
  .bubble {
    position: absolute; top: 16px; left: 14px; background: #fff; color: var(--ink);
    padding: 8px 13px; border-radius: 14px 14px 14px 4px; font-size: 13px; font-weight: 700;
    box-shadow: 0 5px 14px rgba(0,0,0,.2); max-width: 62%; line-height: 1.35;
  }
  .nameplate {
    position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
    background: rgba(255,255,255,.92); padding: 4px 14px; border-radius: 999px;
    font-weight: 800; font-size: 13px; white-space: nowrap;
    box-shadow: 0 4px 10px rgba(0,0,0,.18);
  }
  .float-up {
    position: absolute; font-weight: 800; font-size: 20px; pointer-events: none;
    animation: floatup 1.1s ease-out forwards; text-shadow: 0 2px 4px rgba(0,0,0,.3);
  }
  @keyframes floatup { 0% { opacity: 1; transform: translateY(0) scale(.8);} 100% { opacity:0; transform: translateY(-70px) scale(1.25);} }

  /* ---------- Room canvas ---------- */
  canvas#room {
    display: block; width: 100%; height: auto; aspect-ratio: 640 / 300;
    border-radius: 16px; background: #9fd8f2; touch-action: none;
    box-shadow: inset 0 -14px 26px rgba(0,0,0,.14);
  }
  canvas.portrait {
    display: block; width: 100%; height: auto; aspect-ratio: 140 / 96;
    border-radius: 11px; margin-bottom: 4px;
  }
  canvas.portrait.mini { aspect-ratio: 90 / 62; border-radius: 8px; }
  .swpet canvas.portrait.mini { width: 52px; }

  /* ---------- Walk pad ---------- */
  .pad { display: flex; align-items: center; gap: 10px; margin-top: 9px; flex-wrap: wrap; }
  .dpad { display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .drow { display: flex; gap: 3px; }
  .pbtn {
    width: 38px; height: 32px; border-radius: 9px; background: var(--panel2);
    color: var(--accent-d); font-weight: 800; font-size: 13px; box-shadow: 0 2px 0 var(--line);
  }
  .pbtn:active { transform: translateY(2px); box-shadow: none; background: var(--accent); color: #fff; }
  .acts { display: flex; gap: 6px; flex: 1; flex-wrap: wrap; }
  .abtn {
    background: var(--panel2); color: var(--ink); border-radius: 11px;
    padding: 5px 10px 4px; font-size: 10.5px; font-weight: 800; line-height: 1.15;
    display: flex; flex-direction: column; align-items: center; gap: 1px;
    box-shadow: 0 2px 0 var(--line); min-width: 54px;
  }
  .abtn span { font-size: 17px; }
  .abtn i {
    font-style: normal; font-size: 9px; background: var(--accent); color: #fff;
    border-radius: 4px; padding: 0 4px; margin-top: 1px;
  }
  .abtn:active { transform: translateY(2px); box-shadow: none; }

  /* ---------- Need bars ---------- */
  .needrow { display: flex; align-items: center; gap: 9px; margin: 9px 0; }
  .needrow .nico { font-size: 21px; width: 26px; text-align: center; }
  .needrow .nbody { flex: 1; min-width: 0; }
  .needrow .nlabel { font-size: 12.5px; font-weight: 800; display: flex; justify-content: space-between; margin-bottom: 3px; }
  .needrow .nlabel span:last-child { color: var(--muted); font-weight: 700; }
  .bar { height: 13px; background: var(--line); border-radius: 999px; overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 999px; transition: width .35s ease, background .35s ease; }
  .care-btn {
    background: linear-gradient(180deg,#9b78d8,var(--accent)); color: #fff; font-weight: 800;
    font-size: 12px; padding: 8px 12px; border-radius: 11px; box-shadow: 0 3px 0 var(--accent-d);
    white-space: nowrap;
  }
  .care-btn.urgent { background: linear-gradient(180deg,#ff8a82,var(--bad)); box-shadow: 0 3px 0 var(--bad-d); animation: nudge 1.1s ease-in-out infinite; }
  @keyframes nudge { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-3px);} }
  .care-btn:active { transform: translateY(3px); box-shadow: none; }

  /* ---------- Pet switcher ---------- */
  .switcher { display: flex; gap: 7px; overflow-x: auto; padding-bottom: 4px; }
  .swpet {
    position: relative; flex: 0 0 auto; background: var(--panel2); border-radius: 14px;
    padding: 7px 11px 6px; text-align: center; border: 3px solid transparent; min-width: 62px;
  }
  .swpet.active { border-color: var(--accent); background: #fff; }
  .swpet .e { font-size: 24px; line-height: 1; }
  .swpet .n { font-size: 10.5px; font-weight: 800; margin-top: 2px; max-width: 62px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .swpet .alert { position: absolute; top: -4px; right: -4px; width: 13px; height: 13px; border-radius: 50%; background: var(--bad); box-shadow: 0 0 0 2px #fff; }
  .swpet.add { display: flex; align-items: center; justify-content: center; font-size: 22px; color: var(--muted); }

  /* ---------- Choose pet grid ---------- */
  .petgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px,1fr)); gap: 10px; }
  .petcard {
    background: var(--panel2); border-radius: 16px; padding: 12px; text-align: center;
    border: 3px solid transparent; cursor: pointer; transition: transform .1s ease;
  }
  .petcard:active { transform: scale(.97); }
  .petcard.sel { border-color: var(--accent); background: #fff; box-shadow: 0 6px 16px rgba(126,87,194,.25); }
  .petcard .e { font-size: 40px; line-height: 1; }
  .petcard .n { font-weight: 800; font-size: 14px; margin-top: 4px; }
  .petcard .t { font-size: 11px; color: var(--muted); line-height: 1.3; margin-top: 3px; min-height: 28px; }
  .stars { font-size: 11px; color: var(--treat-d); font-weight: 800; margin-top: 4px; }
  .locked { filter: grayscale(.85); opacity: .6; }

  /* ---------- Chips / tags ---------- */
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    background: var(--panel2); color: var(--accent-d); font-size: 11.5px; font-weight: 800;
    padding: 5px 10px; border-radius: 999px;
  }
  .chip.warn { background: #fff1dc; color: #a2650a; }
  .chip.bad { background: #ffe6e4; color: var(--bad-d); }
  .chip.good { background: #e2f8ec; color: var(--good-d); }

  /* ---------- Guide ---------- */
  .gsec { border: 2px solid var(--line); border-radius: 14px; margin-bottom: 9px; overflow: hidden; }
  .gsec > .gh {
    background: var(--panel2); padding: 11px 13px; font-weight: 800; font-size: 14px;
    display: flex; align-items: center; gap: 8px; cursor: pointer;
  }
  .gsec > .gh .arrow { margin-left: auto; color: var(--muted); font-size: 12px; }
  .gsec .gb { padding: 12px 13px 4px; display: none; }
  .gsec.open .gb { display: block; }
  .gsec.danger > .gh { background: #ffe6e4; color: var(--bad-d); }
  .gb ul { margin: 0 0 10px; padding-left: 19px; }
  .gb li { font-size: 13.5px; line-height: 1.55; margin-bottom: 6px; }
  .gb li b { color: var(--accent-d); }
  .gsec.danger .gb li b { color: var(--bad-d); }
  .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-bottom: 10px; }
  .fact { background: var(--panel2); border-radius: 11px; padding: 8px 10px; }
  .fact .k { font-size: 10.5px; color: var(--muted); font-weight: 800; text-transform: uppercase; letter-spacing: .4px; }
  .fact .v { font-size: 13px; font-weight: 800; margin-top: 1px; }

  /* ---------- Jobs ---------- */
  .job { background: var(--panel2); border-radius: 15px; padding: 12px; margin-bottom: 9px; display: flex; gap: 11px; align-items: center; }
  .job .e { font-size: 34px; }
  .job .jb { flex: 1; min-width: 0; }
  .job .jn { font-weight: 800; font-size: 14px; }
  .job .jd { font-size: 12px; color: var(--muted); line-height: 1.4; margin-top: 2px; }

  /* ---------- Shop ---------- */
  .item { background: var(--panel2); border-radius: 15px; padding: 11px 12px; margin-bottom: 8px; display: flex; gap: 11px; align-items: center; }
  .item .e { font-size: 30px; }
  .item .ib { flex: 1; min-width: 0; }
  .item .iname { font-weight: 800; font-size: 13.5px; }
  .item .idesc { font-size: 11.5px; color: var(--muted); line-height: 1.4; margin-top: 2px; }
  .price { font-weight: 800; font-size: 13px; padding: 8px 12px; border-radius: 11px; white-space: nowrap; }
  .owned { background: #e2f8ec; color: var(--good-d); }

  /* ---------- Tabs ---------- */
  .tabs { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  .tab {
    background: var(--panel2); color: var(--muted); font-weight: 800; font-size: 12.5px;
    padding: 8px 13px; border-radius: 999px;
  }
  .tab.active { background: var(--accent); color: #fff; }

  /* ---------- Modal ---------- */
  .modal {
    position: fixed; inset: 0; z-index: 60; display: none;
    align-items: center; justify-content: center; padding: 14px;
    background: rgba(30,16,60,.62); backdrop-filter: blur(3px);
  }
  .modal.on { display: flex; }
  .sheet {
    background: var(--panel); border-radius: 22px; padding: 18px; width: 100%; max-width: 480px;
    max-height: 88vh; overflow-y: auto; box-shadow: 0 20px 50px rgba(0,0,0,.4);
    animation: pop .2s ease-out;
  }
  @keyframes pop { from { transform: scale(.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .opt {
    display: block; width: 100%; text-align: left; background: var(--panel2);
    border: 3px solid transparent; border-radius: 14px; padding: 12px 14px; margin-bottom: 8px;
    font-size: 14px; font-weight: 700; line-height: 1.4; color: var(--ink);
  }
  .opt:active { transform: scale(.985); }
  .opt.right { border-color: var(--good); background: #e2f8ec; }
  .opt.wrong { border-color: var(--bad); background: #ffe6e4; }
  .opt.dim { opacity: .5; }
  .why {
    border-radius: 14px; padding: 12px 14px; font-size: 13.5px; line-height: 1.55; margin: 4px 0 12px;
  }
  .why.ok { background: #e2f8ec; border-left: 5px solid var(--good); }
  .why.no { background: #ffe6e4; border-left: 5px solid var(--bad); }
  .why b { display: block; margin-bottom: 3px; font-size: 14px; }

  /* ---------- Trust meter ---------- */
  .trust { height: 20px; background: var(--line); border-radius: 999px; overflow: hidden; position: relative; }
  .trust i { display: block; height: 100%; background: linear-gradient(90deg,#ffb3cb,var(--pink)); transition: width .5s ease; }
  .trust span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 11.5px; font-weight: 800; color: var(--ink); }

  /* ---------- Toast ---------- */
  #toast {
    position: fixed; left: 50%; bottom: 92px; transform: translateX(-50%);
    z-index: 80; display: flex; flex-direction: column; gap: 6px; align-items: center;
    pointer-events: none; width: 100%; max-width: 420px; padding: 0 12px;
  }
  .toast {
    background: rgba(45,28,80,.94); color: #fff; font-weight: 700; font-size: 13px;
    padding: 9px 15px; border-radius: 999px; box-shadow: 0 6px 18px rgba(0,0,0,.3);
    animation: tin .25s ease-out; text-align: center;
  }
  .toast.good { background: rgba(30,138,83,.95); }
  .toast.bad { background: rgba(195,63,56,.95); }
  @keyframes tin { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  .backlink { color: #fff; font-size: 12.5px; font-weight: 800; text-decoration: none; opacity: .9; }
  /* comfortable finger-sized target on phones/tablets */
  @media (pointer: coarse), (max-width: 1024px) {
    .backlink { display: inline-flex; align-items: center; min-height: 40px; padding: 0 14px; font-size: 14px; }
  }
  .center { text-align: center; }
  .rowbtns { display: flex; gap: 8px; }
  .rowbtns .btn { flex: 1; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand">🐾 Pet Pals<small>CARE ACADEMY</small></div>
    <div class="purse">
      <div class="coin treats" id="treatCoin">🦴 <span id="treatN">0</span></div>
      <div class="coin hearts" id="heartCoin">💖 <span id="heartN">0</span></div>
    </div>
  </div>

  <div id="screen"></div>

  <div class="center"><a class="backlink" href="index.html">◀ Back to the Arcade</a></div>
</div>

<div class="nav" id="nav"></div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>

<script>
(function () {
'use strict';

/* ============================================================
   PET PALS — CARE ACADEMY
   Single file, no dependencies, no storage. In-memory state only.
   ============================================================ */

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const shuffle = (a) => { const r = a.slice(); for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; };

/* ============================================================
   SPECIES DATA
   Each species: identity, fast facts, five needs (with real care
   questions + explanations), and a long-form care guide.
   need keys are always: food, water, home, play, health
   ============================================================ */

const FAMILIES = {};

/* ---------------------------------------------------------- DOG */
FAMILIES.dog = {
  id: 'dog', name: 'Dog', emoji: '🐶', art: '🐕', tagline: 'Loyal, needy, endlessly enthusiastic.',
  rarity: 'starter', habitat: 'backyard', diff: 3,
  scene: ['#cdeaa0', '#8fd0e8'],
  facts: { Lifespan: '10–15 years', Size: '5–50 kg', Alone: 'Max 4–6 hours', Company: 'People or dog friends', Space: 'Home + daily walks', Cost: 'High (food + vet)' },
  needs: {
    food:   { label: 'Food Bowl',   icon: '🍖', rate: 1.00, tip: 'Measured meals twice a day — free-feeding makes most dogs overweight.' },
    water:  { label: 'Fresh Water', icon: '💧', rate: 0.85, tip: 'Clean water always available; wash the bowl daily.' },
    home:   { label: 'Clean Space', icon: '🧹', rate: 0.62, tip: 'Wash bedding, pick up the yard, keep toxic things out of reach.' },
    play:   { label: 'Walk & Play', icon: '🎾', rate: 1.15, tip: 'Sniffing tires a dog out faster than running does.' },
    health: { label: 'Health Care', icon: '🩺', rate: 0.50, tip: 'Teeth, nails, parasite prevention, yearly vet check.' }
  },
  q: {
    food: [
      { ask: 'It is dinner time. How do you feed your dog?', opts: [
        ['A measured portion of complete dog food, twice a day', true, 'Complete dog foods are formulated to meet AAFCO nutrient profiles for a life stage (puppy / adult / senior). Measure with an actual cup and split it into two meals — this steadies energy and lowers bloat risk in deep-chested breeds. More than half of pet dogs are overweight, and being lean adds roughly two healthy years to a dog\'s life.'],
        ['Leave the bowl full all day so they can graze', false, 'Free-feeding is how most dogs become overweight — dogs are not good at self-regulating. It also makes it impossible to notice the very first sign of illness: a skipped meal. Measure it, serve it, lift the bowl after 15 minutes.'],
        ['Leftovers from your plate', false, 'Table scraps unbalance the diet and hide real dangers. Chocolate, xylitol (sugar-free gum and peanut butter), grapes and raisins, onion and garlic, macadamia nuts, and cooked bones can all injure or kill a dog. Cooked bones splinter — never give them.']
      ]},
      { ask: 'Your dog wants a treat. What is the safe rule?', opts: [

const TIERS = {

function hash32(n) {
  n = n | 0;
  n = Math.imul(n ^ (n >>> 16), 2246822507);
  n = Math.imul(n ^ (n >>> 13), 3266489909);
  return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
}

function keyAt(i) { return i < FAM_N ? FAM_IDS[i] : 'v' + i; }
function indexOfKey(key) { const p = FAM_IDS.indexOf(key); return p >= 0 ? p : +key.slice(1); }

/* Decompose a variant index into coat / line / mark. The multiply-by-a-
   coprime step scatters the names so neighbouring indices look unrelated,
   while staying a bijection — so every one of the 10,000 names is unique. */
function nameParts(i) {
  const j = i - FAM_N;
  const famId = FAM_IDS[j % FAM_N];
  const k = Math.floor(j / FAM_N);
  const span = COAT.length * 8 * MARK.length;
  const m = (k * 1181) % span;
  return {
    famId,
    coat: COAT[m % COAT.length],
    line: LINES[famId][Math.floor(m / COAT.length) % 8],
    mark: MARK[Math.floor(m / (COAT.length * 8)) % MARK.length]
  };
}

function tierAt(i) {
  if (i < FAM_N) return 'documented';
  const r = hash32(i * 2654435761 + 7);
  if (r < 0.58) return 'common';
  if (r < 0.83) return 'uncommon';
  if (r < 0.95) return 'rare';
  return 'legendary';
}

/* A cheap record for lists and search — no guide, no questions. */
function stubAt(i) {
  if (i < FAM_N) {
    const f = FAMILIES[FAM_IDS[i]];
    return { i, key: FAM_IDS[i], name: f.name, fam: FAM_IDS[i], famName: f.name, emoji: f.emoji, tier: 'documented', diff: f.diff };
  }
  const p = nameParts(i);
  const f = FAMILIES[p.famId];
  const tier = tierAt(i);
  let diff = f.diff + (hash32(i * 40503 + 3) < 0.25 ? 1 : hash32(i * 22571 + 9) < 0.2 ? -1 : 0);
  return {
    i, key: 'v' + i, name: `${p.coat} ${p.mark} ${p.line}`,
    fam: p.famId, famName: f.name, emoji: f.emoji, tier, diff: clamp(diff, 1, 5)
  };
}

let STUBS = null;
function stubs() {
  if (!STUBS) { STUBS = new Array(TOTAL_SPECIES); for (let i = 0; i < TOTAL_SPECIES; i++) STUBS[i] = stubAt(i); }
  return STUBS;
}

const spCache = new Map();

/* Full species record. Documented families are returned as-is (with a few
   fields filled in); variants are assembled from their family. */
function getSp(key) {
  if (FAMILIES[key]) {
    const f = FAMILIES[key];
    if (!f.key) { f.key = key; f.fam = key; f.famName = f.name; f.tier = 'documented'; f.traits = []; }
    return f;
  }
  if (spCache.has(key)) return spCache.get(key);

  const i = indexOfKey(key);
  const st = stubAt(i);
  const f = FAMILIES[st.fam];

  const t1 = TRAITS[Math.floor(hash32(i * 7919 + 11) * TRAITS.length)];
  let t2 = TRAITS[Math.floor(hash32(i * 104729 + 17) * TRAITS.length)];
  if (t2 === t1) t2 = TRAITS[(TRAITS.indexOf(t1) + 5) % TRAITS.length];
  const traits = [t1, t2];

  // needs inherit the family's rules, nudged by the traits
  const needs = {};
  NEED_KEYS.forEach(k => {
    needs[k] = Object.assign({}, f.needs[k]);
    traits.forEach(t => { if (t.need === k) needs[k].rate = +(needs[k].rate * t.mult).toFixed(3); });
  });

  const hue = Math.floor(hash32(i * 6151 + 23) * 360);
  const scene = [`hsl(${hue},70%,80%)`, `hsl(${(hue + 40) % 360},55%,58%)`];

  const facts = Object.assign({}, f.facts, {
    Family: f.name,
    Variant: TIERS[st.tier].label
  });

  const guide = [{
    h: 'About this variant', i: '🧬',
    li: [
      `<b>${esc(st.name)}</b> is a ${esc(TIERS[st.tier].label.toLowerCase())} line of <b>${esc(f.name)}</b>. Coat and markings differ; <b>the care does not</b>. Everything below is ${esc(f.name)} husbandry and it applies in full.`,
      `<b>${esc(t1.n)}.</b> ${t1.note}`,
      `<b>${esc(t2.n)}.</b> ${t2.note}`,
      `<b>Never buy on looks.</b> Colour and pattern say nothing about health, and some striking morphs across the pet trade carry inherited problems. Ask about the parents and the line before you take an animal home.`
    ]
  }].concat(f.guide);

  const sp = {
    id: key, key, fam: st.fam, famName: f.name, tier: st.tier, traits,
    name: st.name, emoji: f.emoji, art: f.art,
    tagline: `${/^[aeiou]/i.test(TIERS[st.tier].label) ? 'An' : 'A'} ${TIERS[st.tier].label.toLowerCase()} ${f.name.toLowerCase()} line — ${t1.n.toLowerCase()}, ${t2.n.toLowerCase()}.`,
    rarity: f.rarity, habitat: f.habitat, diff: st.diff,
    scene, facts, needs, q: f.q, guide
  };
  spCache.set(key, sp);
  return sp;
}

/* ============================================================
   LOOK ENGINE
   Every one of the 10,000 entries draws differently: the coat word
   picks the colour, the marking word picks a pattern primitive, and
   the line word reshapes the body. Nothing is an emoji.
   ============================================================ */

const COAT_HEX = {
  Amber:'#e0a33a', Ash:'#b9b6ae', Auburn:'#8c3d22', Azure:'#4f9bd9', Blush:'#f2b6bd',
  Bronze:'#a9702f', Buff:'#e2c391', Butter:'#f2dd8c', Caramel:'#c98a4b', Charcoal:'#4a4a52',
  Chestnut:'#6b3a24', Cinnamon:'#a5613a', Clay:'#b5714f', Cobalt:'#2f5fb5', Copper:'#b96a3a',
  Coral:'#f08a70', Cream:'#f3e6cd', Crimson:'#a52133', Dusk:'#6b5f86', Ember:'#d95f2b',
  Fawn:'#d8b48c', Flint:'#7d7f88', Fern:'#6f9e5a', Ginger:'#d3792e', Gold:'#e3bb44',
  Granite:'#8a8d93', Hazel:'#9b7340', Honey:'#e3ab4f', Indigo:'#4a4a8f', Ink:'#2c2f3d',
  Ivory:'#f2eadb', Jade:'#4fa383', Lilac:'#b9a3d6', Mahogany:'#6d2f22', Malachite:'#3f8f6a',
  Mauve:'#a87f9b', Midnight:'#232742', Mint:'#a8ddc4', Mist:'#cdd6dd', Moss:'#6f8a4f',
  Nutmeg:'#8a5a34', Ochre:'#c08a2e', Onyx:'#33333a', Opal:'#d9e2e8', Pearl:'#f0ece2',
  Pewter:'#9aa0a8', Plum:'#6e3457', Rose:'#e08a9b', Ruby:'#a3243f', Russet:'#9c4a24',
  Saffron:'#e8a52e', Sable:'#4a3a30', Sage:'#a3b58f', Sand:'#ddc9a3', Shadow:'#4b4652',
  Silver:'#c8cdd3', Slate:'#6a7480', Smoke:'#7b7a80', Snow:'#f7f7f4', Storm:'#5c6672'
};

/* 60 marking words collapse onto 14 visually distinct primitives */
const MARK_PRIM = {
  Banded:'bands', Bicolour:'patch', Blotched:'bigspots', Brindle:'stripes', Butterfly:'patch',
  Capped:'cap', Chevron:'bands', Clouded:'bigspots', Collared:'collar', Crescent:'patch',
  Dappled:'spots', Dusted:'ticked', Feathered:'edge', Flecked:'spots', Frosted:'gradient',
  Gilded:'edge', Ghosted:'gradient', Hooded:'cap', Iridescent:'sheen', Laced:'edge',
  Ladder:'bands', Marbled:'swirl', Masked:'mask', Mottled:'bigspots', Notched:'tip',
  Ombre:'gradient', Painted:'patch', Panelled:'saddle', Parti:'patch', Pinstripe:'stripes',
  Quilted:'ticked', Rimmed:'edge', Rippled:'swirl', Roan:'ticked', Rosetted:'spots',
  Sooted:'gradient', Saddled:'saddle', Scalloped:'swirl', Shaded:'gradient', Shell:'saddle',
  Argent:'sheen', Speckled:'spots', Splashed:'bigspots', Spotted:'spots', Starred:'spots',
  Streaked:'stripes', Striped:'stripes', Sunlit:'gradient', Swirled:'swirl', Tipped:'tip',
  Tricolour:'patch', Traced:'edge', Veiled:'gradient', Veined:'stripes', Washed:'gradient',
  Watermark:'swirl', Whorled:'swirl', Windswept:'stripes', Wisped:'stripes', Zoned:'bands'
};

/* signature look for each documented family */
const FAM_LOOK = {
  dog:{coat:'Fawn',mark:'Painted'}, cat:{coat:'Ash',mark:'Striped'}, rabbit:{coat:'Sand',mark:'Bicolour',dli:3},
  hamster:{coat:'Ginger',mark:'Saddled'}, budgie:{coat:'Jade',mark:'Banded'}, betta:{coat:'Cobalt',mark:'Ombre'},
  guineapig:{coat:'Caramel',mark:'Painted'}, gecko:{coat:'Butter',mark:'Spotted'},
  chinchilla:{coat:'Pewter',mark:'Shaded'}, axolotl:{coat:'Blush',mark:'Ghosted'},
  cornsnake:{coat:'Ember',mark:'Blotched'}, cockatiel:{coat:'Sand',mark:'Capped'}
};

const BODYPLAN = {
  dog:'quad', cat:'quad', rabbit:'quad', hamster:'quad', guineapig:'quad', chinchilla:'quad',
  budgie:'bird', cockatiel:'bird', betta:'fish', axolotl:'amph', gecko:'lizard', cornsnake:'snake'
};

function hx(h) { h = h.replace('#',''); return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)]; }
function rgb(a) { return 'rgb(' + a.map(v => clamp(Math.round(v),0,255)).join(',') + ')'; }
function mixc(a, b, t) { const A = hx(a), B = hx(b); return rgb([0,1,2].map(i => A[i] + (B[i]-A[i]) * t)); }
function dk(c, t) { return mixc(c, '#000000', t); }
function lt(c, t) { return mixc(c, '#ffffff', t); }

/* Resolve a species record into a palette + pattern + shape seed. Cached. */
function lookOf(sp) {
  if (sp._look) return sp._look;
  let coat, mark, lineIdx = 0;
  if (sp.tier === 'documented') {
    coat = FAM_LOOK[sp.fam].coat; mark = FAM_LOOK[sp.fam].mark; lineIdx = FAM_LOOK[sp.fam].dli || 0;
  } else {
    const parts = sp.name.split(' ');
    coat = parts[0]; mark = parts[1];
    lineIdx = Math.max(0, LINES[sp.fam].indexOf(parts.slice(2).join(' ')));
  }
  const base = COAT_HEX[coat] || '#c9a97a';
  const accentCoat = COAT[(COAT.indexOf(coat) + 23) % COAT.length];
  const look = {
    fam: sp.fam, plan: BODYPLAN[sp.fam], lineIdx,
    base,
    dark: dk(base, 0.38),
    deep: dk(base, 0.60),
    light: lt(base, 0.34),
    belly: lt(base, 0.55),
    accent: COAT_HEX[accentCoat] || dk(base, 0.5),
    prim: MARK_PRIM[mark] || 'solid',
    eye: '#20222b'
  };
  sp._look = look;
  return look;
}

/* ---- pattern primitives, drawn clipped to the body silhouette ---- */
function paintPattern(g, L, x, y, w, h, seed) {
  const c = L.accent, d = L.dark;
  g.save();
  switch (L.prim) {
    case 'spots': {
      g.fillStyle = d; g.globalAlpha = .55;
      for (let i = 0; i < 16; i++) {
        const r = hash32(seed + i * 977), r2 = hash32(seed + i * 131 + 5);
        const rad = 1.6 + r2 * 2.6;
        g.beginPath(); g.arc(x + r * w, y + r2 * h, rad, 0, 7); g.fill();
      }
      break;
    }
    case 'bigspots': {
      g.fillStyle = d; g.globalAlpha = .5;
      for (let i = 0; i < 6; i++) {
        const r = hash32(seed + i * 613), r2 = hash32(seed + i * 271 + 9);
        g.beginPath(); g.ellipse(x + r * w, y + r2 * h, 3.5 + r * 4.5, 3 + r2 * 3.5, r * 3, 0, 7); g.fill();
      }
      break;
    }
    case 'stripes': {
      g.strokeStyle = d; g.globalAlpha = .5; g.lineWidth = 1.8;
      for (let i = 0; i < 9; i++) {
        const px = x + (i + .5) * (w / 9);
        g.beginPath(); g.moveTo(px, y); g.lineTo(px - w * .06, y + h); g.stroke();
      }
      break;
    }
    case 'bands': {
      g.fillStyle = d; g.globalAlpha = .45;
      for (let i = 0; i < 5; i++) g.fillRect(x, y + (i + .35) * (h / 5), w, h / 13);
      break;
    }
    case 'patch': {
      g.fillStyle = c; g.globalAlpha = .8;
      g.beginPath(); g.ellipse(x + w * .28, y + h * .42, w * .26, h * .34, .3, 0, 7); g.fill();
      g.fillStyle = L.light; g.globalAlpha = .7;
      g.beginPath(); g.ellipse(x + w * .74, y + h * .62, w * .2, h * .26, -.2, 0, 7); g.fill();
      break;
    }
    case 'saddle': {
      g.fillStyle = d; g.globalAlpha = .55;
      g.beginPath(); g.ellipse(x + w * .5, y + h * .3, w * .42, h * .3, 0, 0, 7); g.fill();
      break;
    }
    case 'cap': {
      g.fillStyle = d; g.globalAlpha = .6;
      g.beginPath(); g.ellipse(x + w * .5, y + h * .12, w * .45, h * .2, 0, 0, 7); g.fill();
      break;
    }
    case 'mask': {
      g.fillStyle = d; g.globalAlpha = .55;
      g.beginPath(); g.ellipse(x + w * .5, y + h * .22, w * .3, h * .16, 0, 0, 7); g.fill();
      break;
    }
    case 'collar': {
      g.fillStyle = L.light; g.globalAlpha = .85;
      g.fillRect(x, y + h * .42, w, h * .12);
      break;
    }
    case 'tip': {
      g.fillStyle = d; g.globalAlpha = .6;
      g.fillRect(x, y + h * .78, w, h * .22);
      g.fillRect(x, y, w, h * .1);
      break;
    }
    case 'gradient': {
      const gr = g.createLinearGradient(x, y, x, y + h);
      gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, dk(L.base, .5));
      g.fillStyle = gr; g.globalAlpha = .75; g.fillRect(x, y, w, h);
      break;
    }
    case 'sheen': {
      const gr = g.createLinearGradient(x, y, x + w, y + h);
      gr.addColorStop(0, 'rgba(255,255,255,0)');
      gr.addColorStop(.45, 'rgba(255,255,255,.55)');
      gr.addColorStop(.6, 'rgba(255,255,255,0)');
      g.fillStyle = gr; g.fillRect(x, y, w, h);
      break;
    }
    case 'swirl': {
      g.strokeStyle = d; g.globalAlpha = .45; g.lineWidth = 2;
      for (let i = 0; i < 3; i++) {
        const cx = x + w * (.25 + i * .25), cy = y + h * (.4 + (i % 2) * .2);
        g.beginPath(); g.arc(cx, cy, 3 + i * 2, i, i + 4.2); g.stroke();
      }
      break;
    }
    case 'ticked': {
      g.fillStyle = d; g.globalAlpha = .35;
      for (let i = 0; i < 40; i++) {
        const r = hash32(seed + i * 313), r2 = hash32(seed + i * 97 + 3);
        g.fillRect(x + r * w, y + r2 * h, 1.3, 1.3);
      }
      break;
    }
    case 'edge': {
      g.strokeStyle = L.light; g.globalAlpha = .8; g.lineWidth = 2.4;
      g.strokeRect(x + 1, y + 1, w - 2, h - 2);
      break;
    }
  }
  g.restore();
}

function ell(g, x, y, rx, ry, rot) { g.beginPath(); g.ellipse(x, y, rx, ry, rot || 0, 0, 7); g.fill(); }

/* true relative size — a hamster should not be dog-sized */
const SIZE_MUL = {
  dog: 1.0, cat: .84, rabbit: .76, chinchilla: .62, guineapig: .58, hamster: .46,
  cockatiel: .66, budgie: .5, betta: .66, axolotl: .66, gecko: .72, cornsnake: .9
};

/* fill a silhouette with the coat colour + marking, then outline it */
function patBody(g, L, seed, pathFn, bx, by, bw, bh) {
  g.save();
  g.beginPath(); pathFn(); g.clip();
  g.fillStyle = L.base; g.fillRect(bx, by, bw, bh);
  paintPattern(g, L, bx, by, bw, bh, seed);
  g.restore();
  g.beginPath(); pathFn();
  g.strokeStyle = L.deep; g.lineWidth = 1; g.stroke();
}

/* straight front leg with a paw */
function legF(g, L, x, sw, top) {
  g.strokeStyle = L.dark; g.lineWidth = 3; g.lineCap = 'round';
  g.beginPath(); g.moveTo(x, top); g.lineTo(x + sw * 2, -2); g.stroke();
  g.fillStyle = L.dark; ell(g, x + sw * 2 + .8, -1.4, 2.7, 1.6);
}
/* hind leg with a hock joint */
function legB(g, L, x, sw, top) {
  g.strokeStyle = L.dark; g.lineWidth = 3.2; g.lineCap = 'round'; g.lineJoin = 'round';
  g.beginPath(); g.moveTo(x, top); g.lineTo(x - 3.4, top / 2); g.lineTo(x + sw * 2, -2); g.stroke();
  g.fillStyle = L.dark; ell(g, x + sw * 2 + .8, -1.4, 2.9, 1.6);
}
function eyeDot(g, L, x, y, r) {
  g.fillStyle = L.eye; ell(g, x, y, r, r);
  g.fillStyle = 'rgba(255,255,255,.85)'; ell(g, x + r * .35, y - r * .35, r * .32, r * .32);
}

/* ---- the creature itself ---- */
function drawCreature(g, sp, x, y, s, t, pose, dir, norm) {
  const L = lookOf(sp);
  const seed = (indexOfKey(sp.key) + 1) * 7919;
  const li = L.lineIdx;
  dir = dir || 1;
  const mul = norm ? 1 : (SIZE_MUL[L.fam] || .8);
  const sc = s * mul;
  const bob = pose === 'walk' ? Math.sin(t * 9) * 1.6 * sc : Math.sin(t * 2.2) * 0.8 * sc;
  const legSw = pose === 'walk' ? Math.sin(t * 9) : 0;

  const swims = L.plan === 'fish' || L.plan === 'amph';
  g.save();
  g.fillStyle = 'rgba(0,0,0,' + (swims ? .10 : .20) + ')';
  ell(g, x, y + 2, 15 * sc, 3.6 * sc);
  // aquatic species float rather than stand on the floor line
  g.translate(x, y + bob - (swims ? 15 * sc : 0));
  g.scale(dir * sc, sc);

  if (L.plan === 'quad') {
    if (L.fam === 'dog') drawDog(g, L, li, t, legSw, seed);
    else if (L.fam === 'cat') drawCat(g, L, li, t, legSw, seed);
    else if (L.fam === 'rabbit') drawRabbit(g, L, li, t, legSw, seed);
    else if (L.fam === 'chinchilla') drawChinchilla(g, L, li, t, seed);
    else if (L.fam === 'guineapig') drawGuineaPig(g, L, li, t, legSw, seed);
    else drawHamster(g, L, li, t, legSw, seed);
  }
  else if (L.plan === 'bird') drawBird(g, L, li, t, seed, pose);
  else if (L.plan === 'fish') drawFish(g, L, li, t, seed);
  else if (L.plan === 'lizard') drawLizard(g, L, li, t, legSw, seed);
  else if (L.plan === 'snake') drawSnake(g, L, li, t, seed);
  else if (L.plan === 'amph') drawAmph(g, L, li, t, seed);

  g.restore();
}

/* ---------------- DOG: deep chest, muzzle, real legs ---------------- */
function drawDog(g, L, li, t, sw, seed) {
  const perky = li % 2 === 1, curl = li % 3 === 0, fluffy = li === 2 || li === 5;
  // tail
  g.strokeStyle = L.dark; g.lineCap = 'round'; g.lineWidth = 3.4;
  g.beginPath(); g.moveTo(-15, -25);
  if (curl) g.quadraticCurveTo(-25, -31, -19, -38);
  else { const wag = Math.sin(t * 8) * 5; g.quadraticCurveTo(-25, -25 + wag, -28, -31 + wag); }
  g.stroke();
  legB(g, L, -10, sw, -16); legB(g, L, -13.5, -sw, -16);

  // torso: deep chest at the front, tucked waist, sloping rump
  patBody(g, L, seed, () => {
    g.moveTo(-15, -23);

    g.bezierCurveTo(14, -31, 18, -28, 18, -22);
    g.bezierCurveTo(18, -15, 12, -12, 3, -12.5);
    g.bezierCurveTo(-7, -13, -15, -15, -15, -23);
    g.closePath();
  }, -18, -35, 38, 24);
  // neck + head
  const hx = 21, hy = -34;
  patBody(g, L, seed + 31, () => {
    g.moveTo(hx - 8, hy + 8);
    g.bezierCurveTo(hx - 9, hy - 5, hx + 4, hy - 9, hx + 8, hy - 2);
    g.bezierCurveTo(hx + 17, hy - 1, hx + 18, hy + 6, hx + 9, hy + 7);
    g.bezierCurveTo(hx + 3, hy + 10, hx - 5, hy + 12, hx - 8, hy + 8);
    g.closePath();
  }, hx - 10, hy - 10, 30, 24);
  g.fillStyle = '#2c2f3d'; ell(g, hx + 16, hy + 2.2, 2.1, 1.7);
  g.strokeStyle = L.deep; g.lineWidth = .9;
  g.beginPath(); g.moveTo(hx + 11, hy + 6.4); g.lineTo(hx + 15.5, hy + 5); g.stroke();
  eyeDot(g, L, hx + 4, hy - 1, 1.4);
  // ears
  g.fillStyle = L.dark;
  if (perky) { g.beginPath(); g.moveTo(hx - 2, hy - 5); g.lineTo(hx + 1, hy - 14); g.lineTo(hx + 5, hy - 4); g.fill(); }
  else ell(g, hx - 1, hy + 2, 3.2, 7, -.18);
  if (fluffy) { g.strokeStyle = L.light; g.globalAlpha = .55; g.lineWidth = 2;

}

/* ---------------- CAT: arched back, tall tail, wedge head ---------------- */

  for (let i = -1; i <= 1; i++) { g.beginPath(); g.moveTo(hx + 9, hy + 3); g.lineTo(hx + 18, hy + 1 + i * 2.6); g.stroke(); }
}

/* ---------------- RABBIT: crouched, huge haunches, long ears ---------------- */
function drawRabbit(g, L, li, t, sw, seed) {
  const lop = li === 0;                 // Lop lines: ears hang down
  const lionhead = li === 5;            // Lionhead: mane around the face
  const woolly = li === 2 || li === 4;  // Angora / Satin: long coat
  // powder-puff tail
  g.fillStyle = L.light; ell(g, -14, -13, 3.6, 3.4);
  // hind foot (rabbits sit on long back feet)
  g.fillStyle = L.dark; ell(g, -6, -3, 7, 2.6);
  // front paw tucked under the chest — short, not a stilt
  g.fillStyle = L.dark; ell(g, 9.5 + sw * .6, -3.4, 2.8, 2.1);
  // body: big rounded rear, lower shoulders
  patBody(g, L, seed, () => {
    g.moveTo(-13, -12);
    g.bezierCurveTo(-16, -26, -2, -31, 6, -26);
    g.bezierCurveTo(11, -23, 13, -18, 12, -13);
    g.bezierCurveTo(11, -7, -8, -6, -13, -12);
    g.closePath();
  }, -16, -32, 30, 27);
  // head sits close to the body — no neck
  const hx = 13, hy = -26;
  patBody(g, L, seed + 23, () => {
    g.moveTo(hx - 6, hy + 5);
    g.bezierCurveTo(hx - 7, hy - 4, hx + 2, hy - 7, hx + 6, hy - 3);
    g.bezierCurveTo(hx + 10, hy - 1, hx + 9, hy + 5, hx + 4, hy + 6);
    g.bezierCurveTo(hx, hy + 8, hx - 4, hy + 8, hx - 6, hy + 5);
    g.closePath();
  }, hx - 8, hy - 8, 20, 16);
  // ears — lop lines hang beside the face, everything else stands up
  g.fillStyle = L.dark;
  if (lop) {
    ell(g, hx - 5, hy + 4, 2.9, 8, .38);
    ell(g, hx + 4.5, hy + 4.5, 2.8, 7.8, -.34);
    g.fillStyle = '#e8a9b4';
    ell(g, hx - 5, hy + 4.5, 1.3, 5.4, .38);
    ell(g, hx + 4.5, hy + 5, 1.25, 5.2, -.34);
  } else {
    ell(g, hx - 3, hy - 11, 2.4, 8.5, -.10); ell(g, hx + 2, hy - 11.6, 2.4, 8.8, .10);
    g.fillStyle = '#e8a9b4'; ell(g, hx - 3, hy - 11, 1.1, 6, -.10); ell(g, hx + 2, hy - 11.6, 1.1, 6.2, .10);
  }
  if (lionhead) {   // shaggy mane ringing the head
    g.strokeStyle = L.light; g.lineWidth = 2.2; g.globalAlpha = .85;
    for (let i = 0; i < 11; i++) {
      const a = -1.5 + i * .38;
      g.beginPath(); g.moveTo(hx + Math.cos(a) * 6, hy + Math.sin(a) * 6);
      g.lineTo(hx + Math.cos(a) * 11.5, hy + Math.sin(a) * 11); g.stroke();
    }
    g.globalAlpha = 1;
  }
  if (woolly) {     // long-coated lines get a soft fluff outline
    g.strokeStyle = L.light; g.globalAlpha = .6; g.lineWidth = 2.6;
    g.setLineDash([3, 3]);
    g.beginPath(); g.ellipse(-1, -17, 16, 13, 0, 0, 7); g.stroke();
    g.setLineDash([]); g.globalAlpha = 1;
  }
  g.fillStyle = '#e08a9b'; ell(g, hx + 8.6, hy + 1.6, 1.3, 1.1);
  eyeDot(g, L, hx + 2.5, hy - 1.6, 1.5);
  g.strokeStyle = 'rgba(255,255,255,.7)'; g.lineWidth = .6;
  for (let i = -1; i <= 1; i++) { g.beginPath(); g.moveTo(hx + 8, hy + 2); g.lineTo(hx + 15, hy + i * 2.2); g.stroke(); }
}

/* ---------------- GUINEA PIG: a loaf. no tail, no neck ---------------- */
function drawGuineaPig(g, L, li, t, sw, seed) {
  g.fillStyle = L.dark; ell(g, -7, -2.4, 3, 1.8); ell(g, 7, -2.4, 3, 1.8);
  patBody(g, L, seed, () => {
    g.moveTo(-15, -10);
    g.bezierCurveTo(-16, -20, -6, -24, 4, -23);
    g.bezierCurveTo(13, -22, 18, -18, 18, -12);
    g.bezierCurveTo(18, -5, 8, -3, -2, -3.5);
    g.bezierCurveTo(-10, -4, -15, -5, -15, -10);

  g.fillStyle = L.dark; ell(g, 15.5, -13.5, 2.2, 1.7);

    g.fillStyle = L.light; g.globalAlpha = .7;
    g.beginPath(); g.moveTo(-15, -12); g.lineTo(-24, -2); g.lineTo(-13, -4); g.fill();
    g.globalAlpha = 1;
  }
}

/* ---------------- HAMSTER: tiny, round, cheek pouches ---------------- */
function drawHamster(g, L, li, t, sw, seed) {
  g.fillStyle = L.dark; ell(g, -6, -2, 2.6, 1.6); ell(g, 6, -2, 2.6, 1.6);
  patBody(g, L, seed, () => {

  g.fillStyle = '#e08a9b'; ell(g, 15.4, -12.4, 1.4, 1.1);   // nose
  eyeDot(g, L, 10.5, -17, 1.5);

}

/* ---------------- CHINCHILLA: upright, giant ears, bushy tail ---------------- */
function drawChinchilla(g, L, li, t, seed) {
  // bushy tail sweeping up behind
  g.strokeStyle = L.dark; g.lineCap = 'round'; g.lineWidth = 7;
  g.beginPath(); g.moveTo(-11, -12); g.quadraticCurveTo(-22, -14, -20, -26); g.stroke();
  g.strokeStyle = L.light; g.lineWidth = 3; g.globalAlpha = .5;
  g.beginPath(); g.moveTo(-11, -12); g.quadraticCurveTo(-22, -14, -20, -26); g.stroke();
  g.globalAlpha = 1;
  g.fillStyle = L.dark; ell(g, 4, -2.4, 4, 2);              // hind foot
  // upright pear-shaped body
  patBody(g, L, seed, () => {
    g.moveTo(-11, -10);
    g.bezierCurveTo(-13, -24, -6, -32, 2, -32);
    g.bezierCurveTo(10, -32, 13, -24, 12, -14);
    g.bezierCurveTo(11, -5, -8, -4, -11, -10);
    g.closePath();
  }, -14, -34, 28, 32);
  // tiny front paws held up
  g.strokeStyle = L.dark; g.lineWidth = 2.2;
  g.beginPath(); g.moveTo(9, -20); g.lineTo(13, -16); g.stroke();
  const hx = 5, hy = -33;
  patBody(g, L, seed + 11, () => { g.ellipse(hx, hy, 7, 6, 0, 0, 7); }, hx - 8, hy - 7, 16, 14);
  // enormous round ears
  g.fillStyle = L.dark;
  ell(g, hx - 4, hy - 6, 4.4, 5, -.3); ell(g, hx + 5, hy - 6.4, 4.2, 4.8, .3);
  g.fillStyle = mixc(L.base, '#e08a9b', .5);
  ell(g, hx - 4, hy - 6, 2.4, 3, -.3); ell(g, hx + 5, hy - 6.4, 2.3, 2.9, .3);
  g.fillStyle = '#3a3a44'; ell(g, hx + 7.4, hy + 1.4, 1.3, 1);
  eyeDot(g, L, hx + 3.6, hy - 1.4, 1.7);
  g.strokeStyle = 'rgba(255,255,255,.75)'; g.lineWidth = .6;
  for (let i = -1; i <= 1; i++) { g.beginPath(); g.moveTo(hx + 7, hy + 1); g.lineTo(hx + 15, hy - 1 + i * 2.6); g.stroke(); }
}


function drawBird(g, L, li, t, seed, pose) {
  const flap = pose === 'walk' ? Math.sin(t * 10) * .38 : Math.sin(t * 1.8) * .10;
  const tiel = L.fam === 'cockatiel';
  // long tapering tail
  g.fillStyle = L.dark;
  g.beginPath(); g.moveTo(-5, -16); g.lineTo(-14 - (tiel ? 12 : 6) - li, -2 + li * .5);
  g.lineTo(-9 - (tiel ? 6 : 2), -1); g.lineTo(-4, -9); g.closePath(); g.fill();
  // scaly legs + feet
  g.strokeStyle = '#c98a4b'; g.lineWidth = 1.8; g.lineCap = 'round';
  g.beginPath(); g.moveTo(-1, -8); g.lineTo(-1, -1.5); g.moveTo(4, -8); g.lineTo(4, -1.5); g.stroke();
  g.lineWidth = 1.3;
  g.beginPath(); g.moveTo(-3.4, -1); g.lineTo(1.4, -1); g.moveTo(1.6, -1); g.lineTo(6.4, -1); g.stroke();
  // upright teardrop body
  patBody(g, L, seed, () => {
    g.moveTo(-6, -12);
    g.bezierCurveTo(-9, -24, -3, -32, 3, -32);
    g.bezierCurveTo(9, -32, 12, -24, 11, -16);
    g.bezierCurveTo(10, -9, -4, -7, -6, -12);
    g.closePath();
  }, -10, -33, 24, 27);
  // folded wing
  g.save(); g.translate(1, -22); g.rotate(flap);
  g.fillStyle = L.dark; g.globalAlpha = .9;
  g.beginPath(); g.moveTo(0, -6); g.bezierCurveTo(7, -4, 8, 6, 1, 9);
  g.bezierCurveTo(-4, 7, -4, -3, 0, -6); g.fill();
  g.strokeStyle = L.deep; g.lineWidth = .7; g.globalAlpha = .6;
  for (let i = 0; i < 3; i++) { g.beginPath(); g.moveTo(-1, -1 + i * 3); g.lineTo(6, 1 + i * 2.6); g.stroke(); }
  g.globalAlpha = 1; g.restore();
  // head
  const hx = 6, hy = -37;
  patBody(g, L, seed + 17, () => { g.ellipse(hx, hy, 6.2, 5.8, 0, 0, 7); }, hx - 7, hy - 7, 14, 13);
  if (tiel) {
    g.fillStyle = '#f08a70'; ell(g, hx + 3, hy + 1.4, 2.2, 1.9);          // cheek spot
    g.fillStyle = L.dark;                                                  // crest
    g.beginPath(); g.moveTo(hx - 1, hy - 5);
    g.quadraticCurveTo(hx + 1 + li, hy - 18 - li * .8, hx + 7, hy - 7);
    g.quadraticCurveTo(hx + 3, hy - 5, hx - 1, hy - 5); g.fill();
  } else {
    g.fillStyle = L.light; g.globalAlpha = .8; ell(g, hx + 1, hy + 2.6, 4, 2.4); g.globalAlpha = 1;
    g.fillStyle = L.dark;                                                  // budgie cheek dots
    ell(g, hx + 3.6, hy + 3.4, .9, .9); ell(g, hx + .6, hy + 3.8, .9, .9);
  }
  // hooked beak + cere
  g.fillStyle = '#d8d2c4'; ell(g, hx + 6, hy + .4, 2.6, 2.2);
  g.fillStyle = '#e0a33a';
  g.beginPath(); g.moveTo(hx + 6, hy + .8); g.quadraticCurveTo(hx + 11, hy + 1.6, hx + 7.4, hy + 5);
  g.quadraticCurveTo(hx + 5.6, hy + 3.4, hx + 6, hy + .8); g.fill();
  eyeDot(g, L, hx + 3, hy - 1.4, 1.5);
}

function drawFish(g, L, li, t, seed) {
  const wob = Math.sin(t * 3) * .18;
  const finFill = lt(L.base, .5), finEdge = dk(L.base, .3);
  g.save(); g.rotate(wob);
  g.lineJoin = 'round';
  // caudal fin — the line word IS a tail type, so this is the signature shape
  g.fillStyle = finFill; g.strokeStyle = finEdge; g.lineWidth = 1.1; g.globalAlpha = .88;
  g.beginPath();
  if (li === 0) { g.moveTo(-5,-9); g.quadraticCurveTo(-30,-19,-29,0); g.quadraticCurveTo(-30,19,-5,9); }        // halfmoon
  else if (li === 1) {                                                                                          // crowntail: spiked rays
    g.moveTo(-5,-9);
    for (let i=-4;i<=4;i++){ g.lineTo(-24-Math.abs(i)*.6, i*3.6); g.lineTo(-13, i*3.6+1.9); }
    g.lineTo(-5,9);
  }
  else if (li === 2) { g.moveTo(-5,-8); g.quadraticCurveTo(-26,-6,-30,14); g.quadraticCurveTo(-16,10,-5,7); }   // veiltail: long drooping
  else if (li === 3) { g.moveTo(-5,-6); g.lineTo(-15,-9); g.lineTo(-15,9); g.lineTo(-5,6); }                     // plakat: short
  else if (li === 7) { g.moveTo(-5,-8); g.quadraticCurveTo(-26,-20,-22,-2);                                      // doubletail: two lobes
                       g.quadraticCurveTo(-26,20,-5,8); g.quadraticCurveTo(-14,0,-5,-8); }
  else { g.moveTo(-5,-9); g.quadraticCurveTo(-25,-12,-25,0); g.quadraticCurveTo(-25,12,-5,9); }
  g.closePath(); g.fill(); g.stroke();
  // dorsal + anal fins
  g.beginPath(); g.moveTo(-2,-6); g.quadraticCurveTo(1,-20,12,-5); g.closePath(); g.fill(); g.stroke();
  g.beginPath(); g.moveTo(-2,6); g.quadraticCurveTo(2,21,14,5); g.closePath(); g.fill(); g.stroke();
  g.globalAlpha = 1;
  // body: pointed snout, deep belly
  patBody(g, L, seed, () => {
    g.moveTo(-6, -7);
    g.bezierCurveTo(2, -9, 11, -7, 16, -1);
    g.bezierCurveTo(11, 6, 2, 8, -6, 6);
    g.bezierCurveTo(-8, 2, -8, -3, -6, -7);
    g.closePath();
  }, -8, -9, 26, 18);
  // gill plate
  g.strokeStyle = L.deep; g.lineWidth = .8; g.globalAlpha = .6;
  g.beginPath(); g.moveTo(9, -5.4); g.quadraticCurveTo(6, 0, 9, 5.4); g.stroke(); g.globalAlpha = 1;
  // pectoral fin (oversized on dumbo lines)
  g.fillStyle = L.light; g.globalAlpha = .8;
  ell(g, 8, 2.6, li === 6 ? 5.4 : 2.8, li === 6 ? 3.6 : 2, .4); g.globalAlpha = 1;
  eyeDot(g, L, 13, -2, 1.6);
  g.strokeStyle = L.deep; g.lineWidth = .9;
  g.beginPath(); g.moveTo(15.4, .8); g.lineTo(17, 1.4); g.stroke();   // little mouth
  g.restore();
}

function drawLizard(g, L, li, t, legSw, seed) {
  const wag = Math.sin(t * 2.2) * 3;
  // the fat fat-storing tail — a leopard gecko's most recognisable feature
  patBody(g, L, seed + 41, () => {
    g.moveTo(-6, -13);
    g.bezierCurveTo(-15, -15, -24, -12 + wag * .3, -30, -6 + wag);
    g.bezierCurveTo(-24, -4, -14, -4, -6, -5);
    g.closePath();
  }, -32, -17, 30, 16);
  // splayed legs with toes
  g.strokeStyle = L.dark; g.lineWidth = 2.6; g.lineCap = 'round'; g.lineJoin = 'round';
  [[-2, 1], [10, -1]].forEach((p, i) => {
    const sw = legSw * (i ? 1 : -1) * 1.8;
    [-1, 1].forEach(side => {
      const bx = p[0] + side * 2.4;
      g.beginPath(); g.moveTo(bx, -9); g.lineTo(bx + side * 4, -5); g.lineTo(bx + side * 3 + sw, -1); g.stroke();
      g.strokeStyle = L.dark; g.lineWidth = 1.1;
      for (let k = -1; k <= 1; k++) { g.beginPath(); g.moveTo(bx + side * 3 + sw, -1); g.lineTo(bx + side * 3 + sw + k * 2, .6); g.stroke(); }
      g.lineWidth = 2.6;
    });
  });
  // chunky body
  patBody(g, L, seed, () => {
    g.moveTo(-7, -8);
    g.bezierCurveTo(-6, -16, 4, -18, 11, -15.5);
    g.bezierCurveTo(15, -14, 15, -6, 10, -5);
    g.bezierCurveTo(2, -3.6, -6, -4, -7, -8);
    g.closePath();
  }, -9, -19, 26, 17);
  // broad head with the wide grin
  patBody(g, L, seed + 13, () => {
    g.moveTo(10, -17);
    g.bezierCurveTo(18, -18.5, 25, -15, 25, -11);
    g.bezierCurveTo(25, -7, 17, -5, 10, -6.5);
    g.closePath();
  }, 9, -19, 18, 15);
  eyeDot(g, L, 19, -14, 1.7);
  g.strokeStyle = L.deep; g.lineWidth = 1;
  g.beginPath(); g.moveTo(16, -8.4); g.quadraticCurveTo(21, -7.4, 24.6, -10); g.stroke();
  g.fillStyle = L.deep; ell(g, 24, -13.6, .8, .7);
  // ear opening
  g.fillStyle = dk(L.base, .45); ell(g, 12.6, -12.4, 1.5, 1.9);
}

function drawSnake(g, L, li, t, seed) {
  const amp = 4 + li * .3;
  g.strokeStyle = L.base; g.lineWidth = 7; g.lineCap = 'round'; g.lineJoin = 'round';
  g.beginPath();
  for (let i = 0; i <= 30; i++) {
    const px = -20 + i * 1.3, py = -4 + Math.sin(i * .45 + t * 2.6) * amp * (i / 30);
    i ? g.lineTo(px, py) : g.moveTo(px, py);
  }
  g.stroke();
  // pattern along the body
  g.save();
  g.lineWidth = 7; g.beginPath();
  for (let i = 0; i <= 30; i++) {
    const px = -20 + i * 1.3, py = -4 + Math.sin(i * .45 + t * 2.6) * amp * (i / 30);
    i ? g.lineTo(px, py) : g.moveTo(px, py);
  }
  g.strokeStyle = L.dark; g.globalAlpha = .55; g.setLineDash([4, 5]); g.stroke();
  g.setLineDash([]); g.restore();
  // head
  const hyv = -4 + Math.sin(30 * .45 + t * 2.6) * amp;
  g.fillStyle = L.base; ell(g, 20, hyv, 5, 3.4);
  g.fillStyle = L.eye; ell(g, 22, hyv - 1, 1, 1);
  g.strokeStyle = '#c0392b'; g.lineWidth = .9;
  const tf = Math.sin(t * 4) > .6 ? 4 : 0;
  if (tf) { g.beginPath(); g.moveTo(25, hyv); g.lineTo(29, hyv - 1.4); g.moveTo(25, hyv); g.lineTo(29, hyv + 1.4); g.stroke(); }
}

function drawAmph(g, L, li, t, seed) {
  // tail fin
  g.fillStyle = L.light; g.globalAlpha = .75;
  g.beginPath(); g.moveTo(-6,-6); g.quadraticCurveTo(-20,-2,-20,2); g.quadraticCurveTo(-14,7,-5,5); g.fill();
  g.globalAlpha = 1;
  // legs
  g.strokeStyle = L.base; g.lineWidth = 2.2; g.lineCap='round';
  [[-4,1],[6,-1]].forEach((p,i)=>{ g.beginPath(); g.moveTo(p[0],-1); g.lineTo(p[0]-2,3); g.stroke(); });
  // body
  patBody(g, L, seed, () => {
    g.moveTo(-6, -6);
    g.bezierCurveTo(0, -8, 8, -8, 12, -5);
    g.bezierCurveTo(12, -1, 2, 1, -5, -.5);
    g.bezierCurveTo(-7, -3, -7, -4, -6, -6);
    g.closePath();
  }, -8, -9, 22, 12);
  // wide flat head with the permanent smile
  patBody(g, L, seed + 9, () => {
    g.moveTo(9, -8.4);
    g.bezierCurveTo(15, -10, 20, -8, 20, -4.4);
    g.bezierCurveTo(20, -.6, 13, .4, 9, -1);
    g.closePath();
  }, 8, -11, 14, 13);
  // gill fronds — the axolotl signature
  g.strokeStyle = L.accent; g.lineWidth = 1.6; g.lineCap = 'round';
  for (let side = -1; side <= 1; side += 2) {
    for (let i = 0; i < 3; i++) {
      const a = -.5 + i * .5 + Math.sin(t * 3 + i) * .12;
      g.beginPath(); g.moveTo(9, -5 + side * 2);
      g.lineTo(9 - Math.cos(a) * 7, -5 + side * (3 + Math.sin(a) * 6)); g.stroke();
    }
  }
  eyeDot(g, L, 15.4, -6.4, 1.2);
  g.strokeStyle = dk(L.base, .35); g.lineWidth = .9;
  g.beginPath(); g.moveTo(14.6, -2.6); g.quadraticCurveTo(17.4, -1.6, 19.4, -3.2); g.stroke();
}

/* ============================================================
   ROOM ENGINE — you are a person in a room, not a floating blob
   ============================================================ */

const RW = 640, RH = 300;          // internal resolution
const FLOOR_TOP = 176, FLOOR_BOT = 282;

/* How each family feels about being picked up. This is the guide,
   turned into a mechanic. */
const HANDLING = {
  dog:        { hold: 'ok',    pet: 'ok',   note: 'Most dogs enjoy calm contact on the chest and shoulders.' },
  cat:        { hold: 'brief', pet: 'ok',   note: 'Many cats prefer four feet on the ground. Cheeks and chin, not the belly.' },
  rabbit:     { hold: 'bad',   pet: 'ok',   note: 'Most rabbits hate being lifted — to a prey animal it feels like being caught by a hawk. Sit on the floor and let them come to you.' },
  hamster:    { hold: 'brief', pet: 'ok',   note: 'Scoop onto a flat hand, never grab, and stay low over something soft.' },
  budgie:     { hold: 'brief', pet: 'ok',   note: 'Ask for a step-up onto your finger. Never grab a bird around the body.' },
  betta:      { hold: 'bad',   pet: 'bad',  note: 'Never handle a fish. Their slime coat is their immune barrier.' },
  guineapig:  { hold: 'brief', pet: 'ok',   note: 'Support the chest and the hindquarters, and stay sitting on the floor.' },
  gecko:      { hold: 'brief', pet: 'ok',   note: 'Support from below and never take hold of the tail — they drop it when frightened.' },
  chinchilla: { hold: 'bad',   pet: 'ok',   note: 'Grabbing causes fur slip — they release a patch of fur to escape, and it takes months to grow back.' },
  axolotl:    { hold: 'bad',   pet: 'bad',  note: 'Permeable skin with no scales. Look, do not touch — soap and hand oils pass straight through it.' },
  cornsnake:  { hold: 'ok',    pet: 'ok',   note: 'Support the body, keep it to 10–15 minutes, and never within 48 hours of a meal.' },
  cockatiel:  { hold: 'brief', pet: 'ok',   note: 'Step-up only. Scratch the head and cheeks — stroking the back and tail drives hormonal problems.' }
};

const R = {
  on: false, kind: null, t: 0, raf: null, last: 0,
  keys: {},
  player: { x: 200, y: 240, dir: 1, walk: 0, holding: null },
  actors: [],
  hint: '',
  pop: []
};

function roomCanvas() { return $('room'); }

/* ---- input ---- */
const KEYMAP = { arrowleft:'l', a:'l', arrowright:'r', d:'r', arrowup:'u', w:'u', arrowdown:'d', s:'d' };
window.addEventListener('keydown', (e) => {
  if (!R.on) return;
  const k = e.key.toLowerCase();
  if (KEYMAP[k]) { R.keys[KEYMAP[k]] = true; e.preventDefault(); }
  if (k === 'e') { e.preventDefault(); doInteract(); }
  if (k === 'h') { e.preventDefault(); doHold(); }
  if (k === 'c') { e.preventDefault(); doCall(); }
  if (k === 'f') { e.preventDefault(); doOffer(); }
});
window.addEventListener('keyup', (e) => {
  const k = e.key.toLowerCase();
  if (KEYMAP[k]) R.keys[KEYMAP[k]] = false;
});

function popText(x, y, text, colour) { R.pop.push({ x, y, text, c: colour || '#fff', life: 1 }); }

/* ---- room setup ---- */
function startRoom(kind) {
  R.kind = kind;
  R.on = true;
  R.player.x = kind === 'market' ? 90 : 180;
  R.player.y = 250;
  R.player.holding = null;
  R.actors = [];
  R.pop = [];

  if (kind === 'home') {
    S.pets.forEach((p, i) => {
      R.actors.push({
        type: 'pet', petIdx: i, x: 340 + i * 70 % 240, y: 210 + (i % 3) * 24,
        vx: 0, vy: 0, dir: -1, mode: 'wander', timer: 0, blink: 0
      });
    });
  } else if (kind === 'market') {
    MARKET_STALLS.forEach((st, i) => {
      R.actors.push({ type: 'stall', id: st.id, x: 120 + i * 130, y: 196, st });
    });
  } else if (kind === 'habitat' && S.coax) {
    R.actors.push({ type: 'wild', x: 520, y: 220, vx: 0, dir: -1, timer: 0 });
  }

  const cv = roomCanvas();
  if (cv) { cv.width = RW; cv.height = RH; }
  R.last = performance.now();
  if (!R.raf) R.raf = requestAnimationFrame(roomLoop);
}

function stopRoom() { R.on = false; if (R.raf) { cancelAnimationFrame(R.raf); R.raf = null; } }

/* ---- main loop ---- */
function roomLoop(now) {
  R.raf = requestAnimationFrame(roomLoop);
  const cv = roomCanvas();
  if (!cv || !R.on) return;
  const dt = Math.min((now - R.last) / 1000, 0.05);
  R.last = now; R.t += dt;

  const modalOpen = $('modal').classList.contains('on');
  if (!modalOpen) updateRoom(dt);
  drawRoom(cv.getContext('2d'));
}

function updateRoom(dt) {
  const pl = R.player;
  let dx = 0, dy = 0;
  if (R.keys.l) dx -= 1;
  if (R.keys.r) dx += 1;
  if (R.keys.u) dy -= 1;
  if (R.keys.d) dy += 1;
  const len = Math.hypot(dx, dy) || 1;
  const spd = 118;
  pl.x = clamp(pl.x + (dx / len) * spd * dt, 26, RW - 26);
  pl.y = clamp(pl.y + (dy / len) * spd * dt, FLOOR_TOP, FLOOR_BOT);
  if (dx) pl.dir = dx > 0 ? 1 : -1;
  pl.walk = (dx || dy) ? pl.walk + dt : 0;

  R.actors.forEach(a => {
    if (a.type === 'pet') {
      const p = S.pets[a.petIdx];
      if (!p) return;
      if (pl.holding === a.petIdx) { a.x = pl.x + pl.dir * 10; a.y = pl.y - 16; return; }
      a.timer -= dt;
      const d = Math.hypot(pl.x - a.x, pl.y - a.y);
      if (a.mode === 'come') {
        const ang = Math.atan2(pl.y - a.y, pl.x - a.x);
        if (d > 34) { a.x += Math.cos(ang) * 66 * dt; a.y += Math.sin(ang) * 66 * dt; a.dir = Math.cos(ang) > 0 ? 1 : -1; }
        else a.mode = 'wander';
      } else {
        if (a.timer <= 0) {
          a.timer = 1.2 + Math.random() * 2.4;
          a.vx = (Math.random() - .5) * 34; a.vy = (Math.random() - .5) * 18;
          if (a.vx) a.dir = a.vx > 0 ? 1 : -1;
        }
        a.x = clamp(a.x + a.vx * dt, 30, RW - 30);
        a.y = clamp(a.y + a.vy * dt, FLOOR_TOP, FLOOR_BOT);
      }
      a.moving = a.mode === 'come' || Math.abs(a.vx) > 8;
    } else if (a.type === 'wild') {
      // the wild creature keeps exactly as much distance as it trusts you
      const want = 470 - (S.coax ? S.coax.trust : 0) * 2.6;
      const target = clamp(R.player.x + want * 0.55 + 60, 60, RW - 40);
      a.x += (target - a.x) * 0.9 * dt;
      a.dir = R.player.x < a.x ? -1 : 1;
      a.y = 220 + Math.sin(R.t * 1.3) * 4;
    }
  });

  R.pop.forEach(p => { p.life -= dt * 1.1; p.y -= 26 * dt; });
  R.pop = R.pop.filter(p => p.life > 0);

  R.hint = computeHint();
}

function nearestPet() {
  let best = null, bd = 52;
  R.actors.forEach(a => {
    if (a.type !== 'pet') return;
    const d = Math.hypot(R.player.x - a.x, R.player.y - a.y);
    if (d < bd) { bd = d; best = a; }
  });
  return best;
}
function nearestStall() {
  let best = null, bd = 56;
  R.actors.forEach(a => {
    if (a.type !== 'stall') return;
    const d = Math.hypot(R.player.x - a.x, R.player.y - (a.y + 40));
    if (d < bd) { bd = d; best = a; }
  });
  return best;
}

function computeHint() {
  if (R.kind === 'market') {
    const st = nearestStall();
    return st ? `E — browse ${st.st.name}` : 'Move with WASD or the arrows. Walk up to a stall.';
  }
  if (R.kind === 'habitat') {
    const a = R.actors[0];
    if (!a) return '';
    const d = Math.abs(R.player.x - a.x);
    if (d < 70) return 'E — offer your hand   ·   C — call softly';
    return 'Walk closer. It will not come until it trusts you.';
  }
  const pl = R.player;
  if (pl.holding !== null) return 'H — put them down gently   ·   E — stroke';
  const a = nearestPet();
  if (a) return 'E — stroke   ·   H — pick up   ·   F — offer food   ·   C — call';
  return 'WASD / arrows to walk   ·   C — call your pet over';
}

/* ---- actions ---- */
function activeRoomPet() {
  const a = R.player.holding !== null
    ? R.actors.find(x => x.type === 'pet' && x.petIdx === R.player.holding)
    : nearestPet();
  return a;
}

function doInteract() {
  if (R.kind === 'market') { const st = nearestStall(); if (st) openStall(st.st); return; }
  if (R.kind === 'habitat') { return coaxAttempt(); }
  const a = activeRoomPet();
  if (!a) { toast('Walk over to your pet first.'); return; }
  const p = S.pets[a.petIdx];
  const sp = getSp(p.sp);
  const h = HANDLING[sp.fam];
  S.active = a.petIdx;
  if (h.pet === 'bad') {
    popText(a.x, a.y - 30, '✋', '#ffb3b3');
    toast(h.note, 'bad');
    p.needs.health = clamp(p.needs.health - 4, 0, 100);
  } else {
    popText(a.x, a.y - 30, '💛', '#ffe08a');
    p.needs.play = clamp(p.needs.play + 6, 0, 100);
    a.mode = 'come'; a.timer = 1;
    if (Math.random() < .25) { addTreats(1); popText(a.x + 12, a.y - 40, '+1🦴', '#ffd27a'); }
  }
  refreshBars();
}

function doHold() {
  const pl = R.player;
  if (pl.holding !== null) {
    const a = R.actors.find(x => x.type === 'pet' && x.petIdx === pl.holding);
    if (a) { a.y = clamp(pl.y + 6, FLOOR_TOP, FLOOR_BOT); a.mode = 'wander'; a.timer = .4; }
    pl.holding = null;
    toast('Set down gently.', 'good');
    return;
  }
  const a = nearestPet();
  if (!a) { toast('Nothing to pick up here.'); return; }
  const p = S.pets[a.petIdx];
  const sp = getSp(p.sp);
  const h = HANDLING[sp.fam];
  S.active = a.petIdx;
  if (h.hold === 'bad') {
    popText(a.x, a.y - 30, '😰', '#ffb3b3');
    toast(h.note, 'bad');
    p.needs.health = clamp(p.needs.health - 6, 0, 100);
    p.needs.play = clamp(p.needs.play - 4, 0, 100);
    refreshBars();
    return;
  }
  R.player.holding = a.petIdx;
  popText(a.x, a.y - 30, h.hold === 'brief' ? '🤲' : '🥰', '#fff');
  toast(h.note, h.hold === 'brief' ? '' : 'good');
  if (h.hold === 'ok') p.needs.play = clamp(p.needs.play + 5, 0, 100);
  refreshBars();
}

function doCall() {
  if (R.kind === 'habitat') {
    const a = R.actors[0];
    if (a) { popText(R.player.x, R.player.y - 46, '♪', '#fff'); toast('You call softly. It watches, but it will not come on words alone.'); }
    return;
  }
  let any = false;
  R.actors.forEach(a => { if (a.type === 'pet') { a.mode = 'come'; a.timer = 3; any = true; } });
  if (any) popText(R.player.x, R.player.y - 46, '♪', '#fff');
}

function doOffer() {
  if (R.kind !== 'home') return;
  const a = activeRoomPet() || R.actors.find(x => x.type === 'pet');
  if (!a) return;
  if (S.treats < 5) { toast('Not enough treats — answer some care questions first.', 'bad'); return; }
  const p = S.pets[a.petIdx];
  S.treats -= 5; updatePurse();
  p.needs.food = clamp(p.needs.food + 14, 0, 100);
  p.needs.play = clamp(p.needs.play + 8, 0, 100);
  a.mode = 'come'; a.timer = 2.5;
  popText(a.x, a.y - 32, '🍽️', '#fff');
  toast(`${p.name} trots over.`, 'good');
  refreshBars();
}

/* ---- drawing ---- */
function drawRoom(g) {
  g.clearRect(0, 0, RW, RH);
  if (R.kind === 'market') drawMarketBg(g);
  else if (R.kind === 'habitat') drawHabitatBg(g);
  else drawHomeBg(g);

  const order = R.actors.slice().sort((a, b) => a.y - b.y);
  const drawn = [];
  order.forEach(a => { if (a.y <= R.player.y) drawActor(g, a); else drawn.push(a); });
  drawPlayer(g);
  drawn.forEach(a => drawActor(g, a));

  R.pop.forEach(p => {
    g.save(); g.globalAlpha = clamp(p.life, 0, 1);
    g.font = 'bold 17px sans-serif'; g.fillStyle = p.c; g.textAlign = 'center';
    g.fillText(p.text, p.x, p.y); g.restore();
  });

  if (R.hint) {
    g.save();
    g.font = 'bold 12px system-ui, sans-serif'; g.textAlign = 'center';
    const w = g.measureText(R.hint).width + 22;
    g.fillStyle = 'rgba(20,12,40,.62)';
    g.beginPath(); g.roundRect((RW - w) / 2, RH - 26, w, 20, 10); g.fill();
    g.fillStyle = '#fff'; g.fillText(R.hint, RW / 2, RH - 12);
    g.restore();
  }
}

function drawHomeBg(g) {
  // a consistent, calm room — the animal supplies the colour, not the walls
  const wall = g.createLinearGradient(0, 0, 0, FLOOR_TOP);
  wall.addColorStop(0, '#f3ecfb'); wall.addColorStop(1, '#dcd2ee');
  g.fillStyle = wall; g.fillRect(0, 0, RW, FLOOR_TOP - 20);
  // windows with a bit of sky
  [[70, 34], [470, 34]].forEach(([wx, wy]) => {
    const sky = g.createLinearGradient(0, wy, 0, wy + 68);
    sky.addColorStop(0, '#a9dcf5'); sky.addColorStop(1, '#dff0d0');
    g.fillStyle = sky; g.fillRect(wx, wy, 96, 68);
    g.strokeStyle = '#b7a8d4'; g.lineWidth = 4; g.strokeRect(wx, wy, 96, 68);
    g.beginPath(); g.moveTo(wx + 48, wy); g.lineTo(wx + 48, wy + 68);
    g.moveTo(wx, wy + 34); g.lineTo(wx + 96, wy + 34); g.lineWidth = 2.5; g.stroke();
  });
  // skirting + floor
  g.fillStyle = '#c9bade'; g.fillRect(0, FLOOR_TOP - 26, RW, 8);
  const fl = g.createLinearGradient(0, FLOOR_TOP - 20, 0, RH);
  fl.addColorStop(0, '#c79a68'); fl.addColorStop(1, '#9c7448');
  g.fillStyle = fl; g.fillRect(0, FLOOR_TOP - 20, RW, RH);
  g.strokeStyle = 'rgba(90,62,36,.28)'; g.lineWidth = 1.5;
  for (let i = 0; i < 9; i++) {
    g.beginPath(); g.moveTo(i * 74 + 10, FLOOR_TOP - 18); g.lineTo(i * 74 - 30, RH); g.stroke();
  }
  // rug
  g.fillStyle = 'rgba(255,255,255,.20)';
  g.beginPath(); g.ellipse(RW / 2, 246, 168, 44, 0, 0, 7); g.fill();
  // food + water bowls
  drawBowl(g, 74, 224, '#e8574e'); drawBowl(g, 108, 224, '#4f9bd9');
  // bed
  g.fillStyle = 'rgba(126,87,194,.55)';
  g.beginPath(); g.ellipse(566, 232, 46, 22, 0, 0, 7); g.fill();
  g.fillStyle = 'rgba(255,255,255,.35)';
  g.beginPath(); g.ellipse(566, 230, 34, 14, 0, 0, 7); g.fill();
  // owned toys on the floor
  let tx = 200;
  ['plush','gym','crate'].forEach(id => {
    if (!S.own[id]) return;
    g.font = '20px sans-serif'; g.textAlign = 'center';
    g.fillText(id === 'plush' ? '🧸' : id === 'gym' ? '🎠' : '📦', tx, 268);
    tx += 34;
  });
}

function drawBowl(g, x, y, col) {
  g.fillStyle = 'rgba(0,0,0,.18)'; g.beginPath(); g.ellipse(x, y + 6, 14, 4, 0, 0, 7); g.fill();
  g.fillStyle = col; g.beginPath(); g.ellipse(x, y, 13, 6, 0, 0, 7); g.fill();
  g.fillStyle = 'rgba(255,255,255,.35)'; g.beginPath(); g.ellipse(x, y - 1, 9, 3.4, 0, 0, 7); g.fill();
}

function drawMarketBg(g) {
  const sky = g.createLinearGradient(0, 0, 0, RH);
  sky.addColorStop(0, '#ffd9a8'); sky.addColorStop(1, '#9fd8f2');
  g.fillStyle = sky; g.fillRect(0, 0, RW, RH);
  g.fillStyle = 'rgba(150,120,80,.35)'; g.fillRect(0, FLOOR_TOP - 24, RW, RH);
  for (let i = 0; i < 14; i++) {
    g.fillStyle = i % 2 ? 'rgba(255,255,255,.10)' : 'rgba(0,0,0,.05)';
    g.fillRect(i * 48, FLOOR_TOP - 24, 48, RH);
  }
  // bunting
  g.strokeStyle = 'rgba(255,255,255,.6)'; g.lineWidth = 2;
  g.beginPath(); g.moveTo(0, 18); g.quadraticCurveTo(RW / 2, 44, RW, 18); g.stroke();
  for (let i = 0; i < 13; i++) {
    const t = i / 12, px = t * RW, py = 18 + Math.sin(Math.PI * t) * 26;
    g.fillStyle = ['#ff6f9c','#f7a634','#7e57c2','#2fae6d'][i % 4];
    g.beginPath(); g.moveTo(px - 7, py); g.lineTo(px + 7, py); g.lineTo(px, py + 14); g.fill();
  }
}

function drawHabitatBg(g) {
  const h = S.coax ? HABITATS.find(x => x.id === S.coax.hab) : HABITATS[0];
  const sky = g.createLinearGradient(0, 0, 0, RH);
  sky.addColorStop(0, h.bg[0]); sky.addColorStop(1, h.bg[1]);
  g.fillStyle = sky; g.fillRect(0, 0, RW, RH);
  g.fillStyle = 'rgba(0,0,0,.12)'; g.fillRect(0, FLOOR_TOP - 24, RW, RH);
  for (let i = 0; i < 26; i++) {
    const x = (i * 97) % RW, hgt = 16 + (i % 5) * 9;
    g.strokeStyle = 'rgba(255,255,255,.30)'; g.lineWidth = 2;
    g.beginPath(); g.moveTo(x, FLOOR_TOP + 30);
    g.quadraticCurveTo(x + 4, FLOOR_TOP + 30 - hgt / 2, x + 2, FLOOR_TOP + 30 - hgt); g.stroke();
  }
}

function drawActor(g, a) {
  if (a.type === 'pet') {
    const p = S.pets[a.petIdx];
    if (!p) return;
    const sp = getSp(p.sp);
    const held = R.player.holding === a.petIdx;
    drawCreature(g, sp, a.x, a.y, held ? 1.5 : 1.95, R.t, a.moving ? 'walk' : 'idle', a.dir);
    g.save();
    g.font = 'bold 10px system-ui, sans-serif'; g.textAlign = 'center';
    g.fillStyle = 'rgba(20,12,40,.55)';
    const w = g.measureText(p.name).width + 14;
    g.beginPath(); g.roundRect(a.x - w / 2, a.y + 6, w, 15, 8); g.fill();
    g.fillStyle = '#fff'; g.fillText(p.name, a.x, a.y + 17);
    g.restore();
    if (needsAttention(p)) {
      g.save(); g.font = 'bold 16px sans-serif'; g.textAlign = 'center';
      g.fillStyle = '#e8574e';
      g.fillText('!', a.x + 16, a.y - 34 + Math.sin(R.t * 5) * 2);
      g.restore();
    }
  } else if (a.type === 'stall') {
    drawStall(g, a);
  } else if (a.type === 'wild' && S.coax) {
    drawCreature(g, getSp(S.coax.sp), a.x, a.y, 2.0, R.t, 'idle', a.dir);
    const tr = S.coax.trust;
    g.save();
    g.fillStyle = 'rgba(20,12,40,.5)';
    g.beginPath(); g.roundRect(a.x - 26, a.y + 8, 52, 9, 5); g.fill();
    g.fillStyle = '#ff6f9c';
    g.beginPath(); g.roundRect(a.x - 25, a.y + 9, 50 * tr / 100, 7, 4); g.fill();
    g.restore();
  }
}

function drawStall(g, a) {
  const x = a.x, y = a.y;
  g.fillStyle = 'rgba(0,0,0,.18)';
  g.beginPath(); g.ellipse(x, y + 62, 46, 8, 0, 0, 7); g.fill();
  // counter
  g.fillStyle = '#a9702f'; g.fillRect(x - 42, y + 22, 84, 40);
  g.fillStyle = '#8a5a34'; g.fillRect(x - 42, y + 22, 84, 6);
  // canopy
  for (let i = 0; i < 6; i++) {
    g.fillStyle = i % 2 ? a.st.colour : '#ffffff';
    g.beginPath(); g.moveTo(x - 48 + i * 16, y); g.lineTo(x - 32 + i * 16, y);
    g.lineTo(x - 32 + i * 16, y + 14); g.lineTo(x - 40 + i * 16, y + 20);
    g.lineTo(x - 48 + i * 16, y + 14); g.fill();
  }
  g.fillStyle = '#6b3a24'; g.fillRect(x - 46, y + 12, 4, 52); g.fillRect(x + 42, y + 12, 4, 52);
  // goods
  g.font = '17px sans-serif'; g.textAlign = 'center';
  a.st.icons.forEach((ic, i) => g.fillText(ic, x - 24 + i * 24, y + 40));
  // sign
  g.save();
  g.font = 'bold 11px system-ui, sans-serif';
  const w = g.measureText(a.st.name).width + 16;
  g.fillStyle = 'rgba(20,12,40,.62)';
  g.beginPath(); g.roundRect(x - w / 2, y - 20, w, 17, 8); g.fill();
  g.fillStyle = '#fff'; g.fillText(a.st.name, x, y - 8);
  g.restore();
  if (nearestStall() === a) {
    g.save(); g.strokeStyle = '#fff'; g.lineWidth = 2; g.globalAlpha = .8;
    g.beginPath(); g.roundRect(x - 46, y - 4, 92, 68, 10); g.stroke(); g.restore();
  }
}

function wirePad() {
  document.querySelectorAll('[data-mv]').forEach(el => {
    const d = el.getAttribute('data-mv');
    const on = (e) => { e.preventDefault(); R.keys[d] = true; };
    const off = (e) => { e.preventDefault(); R.keys[d] = false; };
    el.addEventListener('touchstart', on, { passive: false });
    el.addEventListener('touchend', off);
    el.addEventListener('touchcancel', off);
    el.addEventListener('mousedown', on);
    el.addEventListener('mouseup', off);
    el.addEventListener('mouseleave', off);
  });
  document.querySelectorAll('[data-act]').forEach(el => {
    el.onclick = () => { const a = ACTION_BTNS[el.getAttribute('data-act')]; if (a) a.fn(); };
  });
}

/* ---- the avatar ---- */
function drawPlayer(g) {
  const pl = R.player, x = pl.x, y = pl.y;
  const sw = pl.walk ? Math.sin(pl.walk * 11) : 0;
  const bob = pl.walk ? Math.abs(Math.sin(pl.walk * 11)) * 1.6 : Math.sin(R.t * 2) * .8;

  g.save();
  g.fillStyle = 'rgba(0,0,0,.22)';
  g.beginPath(); g.ellipse(x, y + 3, 13, 4, 0, 0, 7); g.fill();
  g.translate(x, y - bob);
  g.scale(pl.dir * 1.35, 1.35);

  // legs
  g.strokeStyle = '#3b4a6b'; g.lineWidth = 4.4; g.lineCap = 'round';
  g.beginPath(); g.moveTo(-3, -16); g.lineTo(-3 + sw * 5, 0); g.stroke();
  g.beginPath(); g.moveTo(3, -16); g.lineTo(3 - sw * 5, 0); g.stroke();
  // body
  g.fillStyle = '#7e57c2';
  g.beginPath(); g.roundRect(-8, -34, 16, 20, 6); g.fill();
  g.fillStyle = 'rgba(255,255,255,.25)';
  g.beginPath(); g.roundRect(-8, -34, 16, 7, 5); g.fill();
  // arms
  g.strokeStyle = '#6a45ad'; g.lineWidth = 3.8;
  if (pl.holding !== null) {
    g.beginPath(); g.moveTo(-5, -30); g.lineTo(7, -24); g.stroke();
    g.beginPath(); g.moveTo(5, -30); g.lineTo(12, -22); g.stroke();
  } else {
    g.beginPath(); g.moveTo(-6, -31); g.lineTo(-8 - sw * 4, -19); g.stroke();
    g.beginPath(); g.moveTo(6, -31); g.lineTo(8 + sw * 4, -19); g.stroke();
  }
  // head
  g.fillStyle = '#f2c9a0';
  g.beginPath(); g.arc(1, -42, 8, 0, 7); g.fill();
  g.fillStyle = '#4a3a30';
  g.beginPath(); g.arc(1, -45, 8, Math.PI, 0); g.fill();
  g.fillRect(-7, -46, 3.5, 5);
  g.fillStyle = '#20222b';
  g.beginPath(); g.arc(4.4, -41.5, 1.2, 0, 7); g.fill();
  g.strokeStyle = '#c98a8a'; g.lineWidth = 1.1;
  g.beginPath(); g.arc(3.4, -38.6, 2, .2, 2.6); g.stroke();
  g.restore();
}

function drawQuestion(spId, needKey) {
  const pool = getSp(spId).q[needKey];
  const q = pick(pool);
  const opts = shuffle(q.opts.map((o, i) => ({ text: o[0], ok: o[1], why: o[2], i })));
  return { ask: q.ask, opts };
}

/* Renders a question into the modal. onDone(correct) fires after the player reads the note. */
function askQuestion(cfg) {
  const { title, sub, spId, needKey, onDone } = cfg;
  const q = drawQuestion(spId, needKey);
  const sp = getSp(spId);

  openModal(`
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:4px">
      <canvas class="portrait" width="140" height="96" data-sp="${sp.key}" style="width:76px;flex:0 0 76px"></canvas>
      <div style="flex:1">
        <h2 style="margin:0">${esc(title)}</h2>
        <div class="sub">${esc(sub || '')}</div>
      </div>
    </div>
    <div class="hr"></div>
    <p style="font-size:15.5px;font-weight:800">${esc(q.ask)}</p>
    <div id="optWrap"></div>
    <div id="afterWrap"></div>
  `);
  paintPortraits($('sheet'));

  const wrap = $('optWrap');
  q.opts.forEach((o, idx) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.textContent = o.text;
    b.onclick = () => choose(idx);
    wrap.appendChild(b);
  });

  function choose(idx) {
    const chosen = q.opts[idx];
    const rightIdx = q.opts.findIndex(o => o.ok);
    Array.from(wrap.children).forEach((b, i) => {
      b.onclick = null;
      if (i === rightIdx) b.classList.add('right');
      else if (i === idx) b.classList.add('wrong');
      else b.classList.add('dim');
    });

    const after = $('afterWrap');
    let html = '';
    if (chosen.ok) {
      html += `<div class="why ok"><b>✅ Exactly right.</b>${esc(chosen.why)}</div>`;
    } else {
      html += `<div class="why no"><b>❌ Not this one.</b>${esc(chosen.why)}</div>`;
      html += `<div class="why ok"><b>✅ The right call: “${esc(q.opts[rightIdx].text)}”</b>${esc(q.opts[rightIdx].why)}</div>`;
    }
    html += `<div class="rowbtns"><button class="btn wide" id="qNext">Got it</button></div>`;
    after.innerHTML = html;
    after.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    $('qNext').onclick = () => onDone(chosen.ok);
  }
}

const PAGE_SIZE = 24;

function filteredStubs(opts) {
  const b = S.browse;
  const q = b.q.trim().toLowerCase();
  const out = [];
  const all = stubs();
  for (let i = 0; i < all.length; i++) {
    const s = all[i];
    if (opts.startersOnly && FAMILIES[s.fam].rarity !== 'starter') continue;
    if (b.fam && s.fam !== b.fam) continue;
    if (b.tier && s.tier !== b.tier) continue;
    if (q && s.name.toLowerCase().indexOf(q) < 0 && s.famName.toLowerCase().indexOf(q) < 0) continue;

}

      <button class="btn ghost small" id="bnext" ${page >= pages - 1 ? 'disabled' : ''}>More ▶</button>
    </div>`;

}

/* draw every visible codex portrait — this is where "different breeds
   look different" actually shows up in lists */
function paintPortraits(root) {
  (root || document).querySelectorAll('canvas.portrait').forEach(cv => {
    if (cv.dataset.done) return;
    const sp = getSp(cv.dataset.sp);
    const g = cv.getContext('2d');
    const grd = g.createLinearGradient(0, 0, 0, cv.height);
    grd.addColorStop(0, sp.scene[0]); grd.addColorStop(1, sp.scene[1]);
    g.fillStyle = grd; g.fillRect(0, 0, cv.width, cv.height);
    const s = (cv.width / 140) * 1.75;
    g.save(); g.translate(cv.width / 2, cv.height - cv.height * 0.16);
    drawCreature(g, sp, 0, 0, s, 0.6, 'idle', 1, true);   // normalised: all framed alike
    g.restore();
    cv.dataset.done = '1';
  });
}

function wireBrowser(rerender) {
  paintPortraits();
  const q = $('bq');
  if (q) {
    q.oninput = () => { S.browse.q = q.value; S.browse.page = 0; rerender(true); };
  }
  document.querySelectorAll('[data-bfam]').forEach(el => {
    el.onclick = () => { S.browse.fam = el.getAttribute('data-bfam'); S.browse.page = 0; rerender(); };
  });
  document.querySelectorAll('[data-btier]').forEach(el => {
    el.onclick = () => { S.browse.tier = el.getAttribute('data-btier'); S.browse.page = 0; rerender(); };
  });
  const pv = $('bprev'), nx = $('bnext');
  if (pv) pv.onclick = () => { S.browse.page--; rerender(); };
  if (nx) nx.onclick = () => { S.browse.page++; rerender(); };
}

function moodOf(p) {
  const h = happiness(p);
  if (h >= 80) return { cls: 'happy', face: '💕' };
  if (h >= 45) return { cls: '', face: '🙂' };
  return { cls: 'sad', face: '💧' };
}

function bubbleFor(p) {
  const sp = getSp(p.sp);
  const low = NEED_KEYS.filter(k => p.needs[k] < 35).sort((a, b) => p.needs[a] - p.needs[b]);
  if (low.length) {
    const k = low[0];
    const msgs = {
      food: 'I am really hungry…', water: 'My water needs sorting…', home: 'It is getting grubby in here…',
      play: 'I am so bored…', health: 'Something does not feel right…'
    };
    return msgs[k];
  }
  const h = happiness(p);
  if (h >= 85) return pick(['This is a good life.', 'You are doing great.', 'Best human.', 'Everything is exactly right.']);
  if (h >= 55) return pick(['All fine here.', 'Doing okay.', 'Could use a check-in soon.']);
  return 'I need a bit more from you.';
}

function refreshBars() {
  const p = activePet();
